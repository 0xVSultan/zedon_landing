<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#4caf50" />
  <meta name="description" content="zedon.tech terminal" />
  <title>zedon.tech — terminal</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="android-chrome-512x512.png" />

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #33ff66;
      --dim: #1a3a22;
      --accent: #00cc55;
      --error: #ff5555;
      --warn: #ffaa00;
      --prompt: #66ff99;
      --cursor: #33ff66;
      --panel: #111;
      --border: #1f3a28;
      --font: "SF Mono", "Fira Code", "Cascadia Code", "JetBrains Mono", "Consolas", "Liberation Mono", Menlo, Monaco, monospace;
      --fs-base: clamp(13px, 1.55vw, 16.5px);
      --line-h: 1.45;
      --pad: clamp(10px, 2.2vw, 26px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      font-size: var(--fs-base);
      line-height: var(--line-h);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    body { display: flex; flex-direction: column; padding: var(--pad); }
    .term-window {
      flex: 1; display: flex; flex-direction: column;
      border: 1px solid var(--dim); border-radius: 10px; overflow: hidden;
      background: #050505;
      box-shadow: 0 0 0 1px rgba(51,255,102,.06), 0 20px 60px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.03);
      max-width: 1100px; width: 100%; margin: 0 auto; min-height: 0; position: relative;
    }
    .titlebar {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      background: linear-gradient(180deg,#141414,#0d0d0d); border-bottom: 1px solid var(--dim);
      user-select: none; flex-shrink: 0;
    }
    .title-icon {
      width: 48px; height: 48px; flex-shrink: 0;
      fill: var(--accent); opacity: 0.95;
    }
    .title {
      flex: 1; text-align: center; font-size: .9em; color: #aaa;
      letter-spacing: .03em; font-weight: 500;
    }
    #terminal {
      flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px 18px 18px;
      scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
    }
    #terminal::-webkit-scrollbar { width: 8px; }
    #terminal::-webkit-scrollbar-track { background: transparent; }
    #terminal::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 4px; }
    .line { white-space: pre-wrap; word-break: break-word; margin-bottom: 2px; }
    .line.cmd { color: var(--fg); }
    .line.out { color: #b8f0c8; }
    .line.err { color: var(--error); }
    .line.warn { color: var(--warn); }
    .line.sys { color: #6a9; }
    .line.info { color: #8cf; }
    .line a.term-link {
      color: #6cf; text-decoration: underline; word-break: break-all;
    }
    .line a.term-link:hover { color: #9df; }
    .prompt { color: var(--prompt); font-weight: 500; }
    .input-row {
      display: flex; align-items: baseline; gap: 0; margin-top: 2px;
    }
    .input-row .prompt { white-space: nowrap; margin-right: 6px; }
    #cmd {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--fg); font-family: inherit; font-size: inherit; line-height: inherit;
      caret-color: var(--cursor); min-width: 0; padding: 0;
    }
    .modal-overlay {
      display: none; position: absolute; inset: 0; background: rgba(0,0,0,.72);
      z-index: 50; align-items: center; justify-content: center; padding: 12px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      width: min(640px, 100%); height: min(88vh, 720px); max-height: 92%;
      display: flex; flex-direction: column;
      box-shadow: 0 24px 80px rgba(0,0,0,.8);
    }
    .modal header {
      padding: 14px 18px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      font-size: .95em; color: #9c9; flex-shrink: 0;
    }
    .modal .body { padding: 16px 18px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; }
    .modal label { display: block; font-size: .8em; color: #7a9; margin-bottom: 4px; }
    .modal textarea, .modal input[type="password"], .modal input[type="text"] {
      width: 100%; background: #0a0a0a; border: 1px solid var(--dim); color: var(--fg);
      font-family: inherit; font-size: .9em; padding: 8px 10px; border-radius: 6px;
      resize: vertical; margin-bottom: 12px;
    }
    .modal textarea { min-height: 220px; flex: 1; }
    .modal .actions { display: flex; gap: 8px; justify-content: flex-end; padding-top: 4px; flex-shrink: 0; }
    .modal .actions button {
      background: #132; border: 1px solid var(--accent); color: var(--fg);
      font-family: inherit; font-size: .85em; padding: 7px 14px; border-radius: 5px; cursor: pointer;
    }
    .modal .actions button.secondary { background: transparent; border-color: var(--dim); }
    .modal .result {
      margin-top: 10px; padding: 10px; background: #0c140e; border: 1px solid var(--dim);
      border-radius: 6px; white-space: pre-wrap; word-break: break-word; font-size: .88em;
      max-height: 240px; overflow-y: auto; display: none; flex-shrink: 0;
    }
    .modal .result.show { display: block; }
    .modal.compact { height: auto; max-height: 92%; }
    .modal select {
      width: 100%; background: #0a0a0a; border: 1px solid var(--dim); color: var(--fg);
      font-family: inherit; font-size: .9em; padding: 8px 10px; border-radius: 6px; margin-bottom: 12px;
    }
    .modal .check { display: flex; gap: 8px; align-items: center; font-size: .85em; color: #9c9; margin-bottom: 12px; }
    .modal .check input { width: auto; margin: 0; }
    #humanWidget { min-height: 70px; display: flex; justify-content: center; align-items: center; margin-bottom: 12px; }
    @media (max-width: 600px) {
      :root { --fs-base: 13.5px; --pad: 7px; }
      .term-window { border-radius: 8px; }
      .titlebar { padding: 8px 12px; gap: 8px; }
      .title-icon { width: 40px; height: 40px; }
      .title { font-size: .85em; }
      #terminal { padding: 12px 12px 14px; }
      .modal { height: min(92vh, 100%); width: 100%; }
      .modal textarea { min-height: 160px; }
    }
    @media (min-width: 1200px) { :root { --fs-base: 16px; } }
  </style>
</head>
<body>
  <div class="term-window">
    <div class="titlebar">
      <svg class="title-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M32,22V3H7V5H0V26H12V22h6v3H14v1H25V25H21V22H32ZM7,18H3V16H7v2Zm0-5H1V10H7v3ZM7,6V9H1V6H7Zm4,19H1V14H7v1H2v4H7v3h4v3ZM8,21V4H31V21H8Zm12,4H19V22h1v3Z"/>
        <circle cx="3" cy="22" r="1"/>
        <path d="M30,5H9V20H30V5ZM29,19H10V6H29V19Z"/>
      </svg>
      <div class="title" id="windowTitle">guest@zedon.tech — bash</div>
    </div>
    <div id="terminal" aria-live="polite">
      <div class="input-row" id="inputRow">
        <span class="prompt" id="promptLabel">guest@zedon.tech:~$</span>
        <input type="text" id="cmd" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" autofocus />
      </div>
    </div>

    <div class="modal-overlay" id="decodeModal">
      <div class="modal">
        <header>
          <span>decode — PGP decrypt</span>
        </header>
        <div class="body">
          <div id="decodeKeyInfo" style="font-size:.82em;color:#7a9;margin-bottom:12px;padding:8px 10px;background:#0c140e;border:1px solid var(--dim);border-radius:6px;"></div>
          <div id="decodeKeyWrap">
            <label>Key to decrypt with</label>
            <select id="decodeKey"></select>
          </div>
          <label>Armored ciphertext (-----BEGIN PGP MESSAGE----- ...)</label>
          <textarea id="decodeCipher" placeholder="Paste encrypted message here..."></textarea>
          <div id="decodePassWrap">
            <label id="decodePassLabel">Passphrase (optional — leave empty to use login password)</label>
            <input type="password" id="decodePass" placeholder="Leave empty to use session password" />
          </div>
          <div class="actions">
            <button type="button" class="secondary" id="decodeCancel">Cancel</button>
            <button type="button" id="decodeRun">Decrypt</button>
          </div>
          <div class="result" id="decodeResult"></div>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="importModal">
      <div class="modal">
        <header>
          <span>import — PGP private key</span>
        </header>
        <div class="body">
          <div id="importInfo" style="font-size:.82em;color:#7a9;margin-bottom:12px;padding:8px 10px;background:#0c140e;border:1px solid var(--dim);border-radius:6px;"></div>
          <label>Armored private key (-----BEGIN PGP PRIVATE KEY BLOCK----- ...)</label>
          <textarea id="importKey" placeholder="Paste your private key here..."></textarea>
          <label>Passphrase of THIS key (may differ from your login password; empty if the key is not protected)</label>
          <input type="password" id="importPass" placeholder="Key passphrase" />
          <label class="check" id="importPublishRow"><input type="checkbox" id="importPublish" checked /> Use as my registered key (publish its public part)</label>
          <div class="actions">
            <button type="button" class="secondary" id="importCancel">Cancel</button>
            <button type="button" id="importRun">Import</button>
          </div>
          <div class="result" id="importResult"></div>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="humanModal">
      <div class="modal compact">
        <header>
          <span>verify — human check</span>
        </header>
        <div class="body">
          <div id="humanStatus" style="font-size:.85em;color:#7a9;margin-bottom:12px;"></div>
          <div id="humanWidget"></div>
          <div class="actions">
            <button type="button" class="secondary" id="humanCancel">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
  (async function () {
    const DOMAIN = "zedon.tech";
    const WORKER_URL = "https://wispy-sky-14c4.the-original-vij.workers.dev/send";
    const STORAGE_KEY = "zedon_terminal_v1";
    const INSTALL_KEY = "zedon_install_v1";
    const TURNSTILE_SITE_KEY = "0x4AAAAAAFKP8YyP93rHLcry"; // public; the secret lives in the Worker
    const TOKEN_KEY = "zedon_token_v1";
    // Username registry lives on the same Worker (…/users/check, …/users/register)
    const API_BASE = WORKER_URL.replace(/\/send\/?$/, "");
    async function registryCall(path, body) {
      const res = await fetch(API_BASE + path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      let data = {};
      try { data = await res.json(); } catch (e) {}
      return { ok: res.ok, status: res.status, data: data || {} };
    }

    // ───── keccak256 begin (Ethereum Keccak-256, 0x01 padding; NOT NIST SHA3-256) ─────
    const KECCAK_RC = [
      "0000000000000001", "0000000000008082", "800000000000808a", "8000000080008000",
      "000000000000808b", "0000000080000001", "8000000080008081", "8000000000008009",
      "000000000000008a", "0000000000000088", "0000000080008009", "000000008000000a",
      "000000008000808b", "800000000000008b", "8000000000008089", "8000000000008003",
      "8000000000008002", "8000000000000080", "000000000000800a", "800000008000000a",
      "8000000080008081", "8000000000008080", "0000000080000001", "8000000080008008"
    ].map(function (x) { return [parseInt(x.slice(0, 8), 16) >>> 0, parseInt(x.slice(8), 16) >>> 0]; });
    const KECCAK_ROTC = [1, 3, 6, 10, 15, 21, 28, 36, 45, 55, 2, 14, 27, 41, 56, 8, 25, 43, 62, 18, 39, 61, 20, 44];
    const KECCAK_PILN = [10, 7, 11, 17, 18, 3, 5, 16, 8, 21, 24, 4, 15, 23, 19, 13, 12, 2, 20, 14, 22, 9, 6, 1];
    function rotl64(hi, lo, n) {
      if (n === 32) return [lo, hi];
      if (n < 32) return [((hi << n) | (lo >>> (32 - n))) >>> 0, ((lo << n) | (hi >>> (32 - n))) >>> 0];
      const m = n - 32;
      return [((lo << m) | (hi >>> (32 - m))) >>> 0, ((hi << m) | (lo >>> (32 - m))) >>> 0];
    }
    function keccakF(hi, lo) {
      const bcH = new Uint32Array(5), bcL = new Uint32Array(5);
      for (let round = 0; round < 24; round++) {
        for (let i = 0; i < 5; i++) {
          bcH[i] = hi[i] ^ hi[i + 5] ^ hi[i + 10] ^ hi[i + 15] ^ hi[i + 20];
          bcL[i] = lo[i] ^ lo[i + 5] ^ lo[i + 10] ^ lo[i + 15] ^ lo[i + 20];
        }
        for (let i = 0; i < 5; i++) {
          const r = rotl64(bcH[(i + 1) % 5], bcL[(i + 1) % 5], 1);
          const tH = bcH[(i + 4) % 5] ^ r[0], tL = bcL[(i + 4) % 5] ^ r[1];
          for (let j = 0; j < 25; j += 5) { hi[j + i] ^= tH; lo[j + i] ^= tL; }
        }
        let tH = hi[1], tL = lo[1];
        for (let i = 0; i < 24; i++) {
          const j = KECCAK_PILN[i], h0 = hi[j], l0 = lo[j];
          const r = rotl64(tH, tL, KECCAK_ROTC[i]);
          hi[j] = r[0]; lo[j] = r[1];
          tH = h0; tL = l0;
        }
        for (let j = 0; j < 25; j += 5) {
          for (let i = 0; i < 5; i++) { bcH[i] = hi[j + i]; bcL[i] = lo[j + i]; }
          for (let i = 0; i < 5; i++) {
            hi[j + i] ^= ~bcH[(i + 1) % 5] & bcH[(i + 2) % 5];
            lo[j + i] ^= ~bcL[(i + 1) % 5] & bcL[(i + 2) % 5];
          }
        }
        hi[0] ^= KECCAK_RC[round][0];
        lo[0] ^= KECCAK_RC[round][1];
      }
    }
    function le32hex(x) {
      let s = "";
      for (let k = 0; k < 4; k++) s += ((x >>> (8 * k)) & 0xff).toString(16).padStart(2, "0");
      return s;
    }
    /** Keccak-256 of a UTF-8 string → 64 lowercase hex chars. */
    function keccak256Hex(str) {
      const msg = new TextEncoder().encode(str);
      const rate = 136;
      const data = new Uint8Array(msg.length + (rate - (msg.length % rate)));
      data.set(msg);
      data[msg.length] ^= 0x01;
      data[data.length - 1] ^= 0x80;
      const hi = new Uint32Array(25), lo = new Uint32Array(25);
      for (let off = 0; off < data.length; off += rate) {
        for (let i = 0; i < rate / 8; i++) {
          const b = off + i * 8;
          lo[i] ^= data[b] | (data[b + 1] << 8) | (data[b + 2] << 16) | (data[b + 3] << 24);
          hi[i] ^= data[b + 4] | (data[b + 5] << 8) | (data[b + 6] << 16) | (data[b + 7] << 24);
        }
        keccakF(hi, lo);
      }
      let out = "";
      for (let i = 0; i < 4; i++) out += le32hex(lo[i]) + le32hex(hi[i]);
      return out;
    }
    // ───── keccak256 end ─────

    // ───── Human check: Cloudflare Turnstile → Worker session token ─────
    // The challenge is solved once; the Worker verifies it and returns a signed token
    // (valid ~7 days). Messages and registrations carry that token, and the Worker's
    // daily limits are counted per token, so people behind a shared IP (CGNAT) do not
    // use up each other's quota.
    function loadToken() {
      try {
        const t = JSON.parse(localStorage.getItem(TOKEN_KEY) || "null");
        if (t && t.token && t.exp * 1000 > Date.now() + 60000) return t.token;
      } catch (e) {}
      return null;
    }
    function clearToken() {
      try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    }
    function solveTurnstile() {
      return new Promise(function (resolve, reject) {
        const modal = document.getElementById("humanModal");
        const box = document.getElementById("humanWidget");
        const status = document.getElementById("humanStatus");
        let widgetId = null;
        let finished = false;
        let overall = null;
        function finish(err, tok) {
          if (finished) return;
          finished = true;
          clearTimeout(overall);
          try { if (widgetId !== null && window.turnstile) window.turnstile.remove(widgetId); } catch (e) {}
          box.innerHTML = "";
          modal.classList.remove("open");
          if (err) reject(err); else resolve(tok);
        }
        document.getElementById("humanCancel").onclick = function () { finish(new Error("cancelled")); };
        status.textContent = "Human check, once per session. The challenge shows here only if needed.";
        modal.classList.add("open");
        overall = setTimeout(function () { finish(new Error("timed out")); }, 90000);
        (function waitForApi(tries) {
          if (finished) return;
          if (window.turnstile && window.turnstile.render) {
            try {
              widgetId = window.turnstile.render(box, {
                sitekey: TURNSTILE_SITE_KEY,
                theme: "dark",
                appearance: "interaction-only",
                callback: function (t) { finish(null, t); },
                "error-callback": function () { status.textContent = "Challenge error, retrying…"; }
              });
            } catch (e) { finish(e); }
          } else if (tries >= 100) {
            finish(new Error("Turnstile script did not load (blocked by an extension or the network?)"));
          } else {
            setTimeout(function () { waitForApi(tries + 1); }, 100);
          }
        })(0);
      });
    }
    async function getSessionToken(force) {
      if (!force) {
        const t = loadToken();
        if (t) return t;
      }
      print("Human check required (once per session)...", "sys");
      const ts = await solveTurnstile();
      const r = await registryCall("/token", { turnstile: ts });
      if (!r.ok) throw new Error(r.data.error || ("HTTP " + r.status));
      try { localStorage.setItem(TOKEN_KEY, JSON.stringify({ token: r.data.token, exp: r.data.exp })); } catch (e) {}
      return r.data.token;
    }

    // ───── Account helpers (email OTP) ─────
    function maskEmail(e) {
      const s = String(e || "");
      const i = s.indexOf("@");
      return i > 0 ? s[0] + "***" + s.slice(i) : "***";
    }
    function hasUserToken() {
      return !!(session && session.userToken && session.userTokenExp * 1000 > Date.now());
    }
    let restoreCtx = null; // set while a new-device restore waits for the key in the import panel
    function resetInteractive() {
      interactive = null;
      restoreCtx = null;
      document.getElementById("importModal").classList.remove("open");
      input.type = "text";
      refreshPrompt();
    }
    /** Ask the Worker to email a registration code. Returns true when it was sent. */
    async function requestRegisterOtp(d) {
      busy = true;
      input.disabled = true;
      let ok = false;
      try {
        const tok = await getSessionToken(false);
        const r = await registryCall("/register/start", { name: d.name, email: d.email, token: tok });
        if (r.ok) {
          print("A 6-digit code was sent to " + maskEmail(d.email) + " (valid " + Math.round((r.data.expires_in || 600) / 60) + " min).", "info");
          ok = true;
        } else {
          if (r.status === 401) clearToken();
          print(r.data.error || ("Registry error (" + r.status + ")"), "err");
        }
      } catch (e) {
        print("Verification failed: " + (e.message || e), "err");
      } finally {
        busy = false;
        input.disabled = false;
        input.focus();
      }
      return ok;
    }
    // ───── What the user is told about login / export / import (also: 'help <command>') ─────
    const EXPLAIN = {
      login: [
        "How login works",
        "  1. Your keys and messages live ONLY in this browser, encrypted with your local password.",
        "     'login <name>' asks for that password and unlocks them. The password is never sent anywhere.",
        "  2. To SEND messages the server must know it is really you. When your session is not verified",
        "     (first login on this device, or after the 30-day verification expired) a 6-digit code is",
        "     emailed to the address you registered with. Type it to verify.",
        "     Without verification you can still read and decrypt, but not send.",
        "  3. New device or browser? 'login <name>' restores your account there (see below)."
      ],
      restore: [
        "How restoring an account on a new device works",
        "  1. A 6-digit code is emailed to the address you registered with. It proves the account is yours.",
        "  2. You choose a NEW password for this device. It only protects the keys stored in this browser.",
        "  3. You import your PRIVATE key file (<name>-private.asc, made by 'export' on the old device)",
        "     and enter that key's own passphrase (usually your OLD password).",
        "  The server never has your private key. It only checks that the key you import matches the",
        "  public key stored for the account.",
        "  Lost the key file? You can create a NEW key instead, but old messages stay unreadable.",
        "  Your local message history is not restored (it was never on the server)."
      ],
      export: [
        "How export works",
        "  export        downloads <name>.asc (public key) and <name>-private.asc (PRIVATE key)",
        "  export all    also downloads every other key of this account (imported / previous)",
        "  - The private key file is your BACKUP. It stays protected by the key's passphrase (your login",
        "    password at registration, or the imported key's own passphrase).",
        "  - Keep it offline and safe: anyone with the file AND the passphrase can read your messages.",
        "  - The server never receives it. If the file is lost and this browser is wiped, the messages",
        "    cannot be recovered.",
        "  - To restore on another device: 'login <name>' there, then import this file."
      ],
      import: [
        "How import works",
        "  Imports a PGP private key you already have (a file from 'export', or your own gpg key).",
        "  - The key stays in this browser, encrypted with your login password. It is never uploaded.",
        "  - The key keeps its OWN passphrase, which may differ from your login password.",
        "    You enter it in 'decode' each time; it is not stored.",
        "  - 'Use as my registered key' ticked: only the PUBLIC part is sent to the server, people encrypt",
        "    to this key from now on, and your previous key stays here for old messages.",
        "    Unticked: the key is only added here, for decrypting.",
        "  - Publishing needs a verified session."
      ]
    };
    function explain(topic) {
      EXPLAIN[topic].forEach(function (l) { print(l, "sys"); });
    }

    /** Email a login code for `name`; `where` describes the address for the user. Returns true when sent. */
    async function requestLoginOtp(name, where) {
      busy = true;
      input.disabled = true;
      let ok = false;
      try {
        const tok = await getSessionToken(false);
        const r = await registryCall("/login/start", { name: name, token: tok });
        if (r.ok) {
          print("A verification code was sent to " + where + " (valid " + Math.round((r.data.expires_in || 600) / 60) + " min).", "info");
          ok = true;
        } else {
          if (r.status === 401) clearToken();
          print("Could not request a code: " + (r.data.error || ("HTTP " + r.status)), "err");
        }
      } catch (e) {
        print("Verification failed: " + (e.message || e), "err");
      } finally {
        busy = false;
        input.disabled = false;
        input.focus();
      }
      return ok;
    }
    /** After the local password check: email a login code, then wait for it in the 'login_otp' step. */
    async function startLoginOtp() {
      print("Your session is not verified (first login here, or the 30-day verification expired).", "sys");
      if (await requestLoginOtp(session.name, maskEmail(session.email))) {

    /** New device: confirm that the account exists, then email the login code. */
    async function beginRestore(name) {
      busy = true;
      input.disabled = true;

      try {
        try {
          await getSessionToken(false);
        } catch (e) {
          print("Verification failed: " + (e.message || e), "err");
          return;
        }

        } else if (r.data.available) {

        } else if (r.data.reason !== "taken") {
          print("'" + name + "' cannot be restored (" + (r.data.reason || "unavailable") + ").", "err");
        } else {
          ok = true;

      } catch (e) {
        print("Registry unreachable: " + (e.message || e), "err");
      } finally {
        busy = false;
        input.disabled = false;
        input.focus();
      }
      if (!ok) { resetInteractive(); return; }
      if (!(await requestLoginOtp(name, "the email address registered for this account"))) { resetInteractive(); return; }
      interactive = { step: "restore_otp", data: { name: name } };
      input.type = "text";
      print("Enter the code ('resend' for a new one, 'cancel' to stop):");

    }
    function printRestoreOptions(d) {

      print("  newkey   the key file is lost: create a NEW key (old messages stay unreadable)", "sys");
      print("  cancel   stop; nothing is saved on this device", "sys");
    }
    async function finishRestore(d, publicKey, privateKey, loginPass) {

        name: d.name, password: d.password,

      };

    const DOHStatus = { NoError: 0 };
    async function queryDNSRecords(hostname, recordType) {
      const r = await fetch(
        `https://1.1.1.1/dns-query?name=${encodeURIComponent(hostname)}&type=${recordType}`,
        { headers: { Accept: "application/dns-json" } }
      );
      if (!r.ok) throw new Error(`DoH failed: ${r.status}`);
      const response = await r.json();
      if (typeof response.Status !== "number") throw new Error("Unexpected DoH response");
      return response;
    }
    async function queryTXT(hostname) {
      const r = await queryDNSRecords(hostname, "TXT");
      if (r.Status !== DOHStatus.NoError) return [];
      return (r.Answer || []).map(a => {
        try { return JSON.parse(a.data); } catch { return String(a.data).replace(/^"|"$/g, ""); }
      });
    }

    async function deriveKey(password, salt) {
      const enc = new TextEncoder();
      const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: 120000, hash: "SHA-256" },
        base,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }
    async function encryptLocal(password, plaintext) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveKey(password, salt);
      const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(plaintext));
      return {
        salt: btoa(String.fromCharCode(...salt)),
        iv: btoa(String.fromCharCode(...iv)),
        data: btoa(String.fromCharCode(...new Uint8Array(ct)))
      };
    }
    async function decryptLocal(password, blob) {
      const salt = Uint8Array.from(atob(blob.salt), c => c.charCodeAt(0));
      const iv = Uint8Array.from(atob(blob.iv), c => c.charCodeAt(0));
      const data = Uint8Array.from(atob(blob.data), c => c.charCodeAt(0));
      const key = await deriveKey(password, salt);
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
      return new TextDecoder().decode(pt);
    }

    async function generatePGPKey(name, email, passphrase) {
      const { privateKey, publicKey } = await openpgp.generateKey({
        type: "ecc",
        curve: "curve25519",
        userIDs: [{ name, email: email || (name + "@zedon.tech") }],
        passphrase,
        format: "armored"
      });
      return { privateKey, publicKey };
    }
    async function encryptMessage(plaintext, publicKeyArmored) {
      const publicKey = await openpgp.readKey({ armoredKey: publicKeyArmored });
      const message = await openpgp.createMessage({ text: plaintext });
      return openpgp.encrypt({ message, encryptionKeys: publicKey, format: "armored" });
    }
    async function decryptMessage(ciphertext, privateKeyArmored, passphrase) {
      let privateKey = await openpgp.readPrivateKey({ armoredKey: privateKeyArmored });
      if (!privateKey.isDecrypted()) {
        privateKey = await openpgp.decryptKey({ privateKey: privateKey, passphrase: passphrase });
      }
      const message = await openpgp.readMessage({ armoredMessage: ciphertext });
      const { data } = await openpgp.decrypt({ message, decryptionKeys: privateKey, format: "utf8" });
      return data;
    }
    function normalizeFp(fp) {
      if (!fp) return "";
      return String(fp).replace(/[^0-9a-fA-F]/g, "").toUpperCase();
    }
    function fingerprintsMatch(expected, actual) {
      const a = normalizeFp(expected);
      const b = normalizeFp(actual);
      if (!a || !b) return false;
      // allow full fingerprint or suffix (16+ hex chars)
      if (a.length >= 16 && b.length >= 16) {
        return b.endsWith(a) || a.endsWith(b) || a === b;
      }
      return a === b;
    }
    async function fingerprintOfArmored(armored) {
      try {
        const key = await openpgp.readKey({ armoredKey: armored });
        return key.getFingerprint().toUpperCase();
      } catch (e) {
        return null;
      }
    }
    // armored public key -> full hex fingerprint (filled by primeFingerprint, read synchronously)
    const fpCache = new Map();
    async function primeFingerprint(armored) {
      if (!armored || !/BEGIN PGP/.test(armored)) return null;
      if (fpCache.has(armored)) return fpCache.get(armored);
      const fp = await fingerprintOfArmored(armored);
      if (fp) fpCache.set(armored, fp);
      return fp;
    }
    /** Last 16 hex chars of the key fingerprint (same format as DNS fp=). */
    function fingerprintShort(armoredOrFp) {
      if (!armoredOrFp) return "(none)";
      if (/BEGIN PGP/.test(armoredOrFp)) {
        const fp = fpCache.get(armoredOrFp);
        return fp ? fp.slice(-16) : "(unknown)";
      }
      const norm = normalizeFp(armoredOrFp);
      return norm ? norm.slice(-16) : "(?)";
    }
    /** Resolve remote user PGP: fetch URL if needed, verify against DNS fingerprint */
    async function resolveRecipientPublicKey(target) {
      if (!target) return null;
      // LOCAL session key already armored
      if (target.source === "LOCAL" && target.pgp && /BEGIN PGP/.test(target.pgp)) {
        return target.pgp;
      }
      let armored = null;
      const ref = target.pgp || target.pgpUrl || null;
      const expectedFp = target.pgpFp || null;

      if (ref && /^https?:\/\//i.test(ref)) {
        print("Fetching PGP key: " + ref, "sys");
        const res = await fetch(ref, { credentials: "omit" });
        if (!res.ok) throw new Error("Key fetch failed HTTP " + res.status);
        armored = (await res.text()).trim();
        if (!/BEGIN PGP PUBLIC KEY BLOCK/.test(armored)) {
          throw new Error("Fetched file is not an armored public key");
        }
      } else if (ref && /BEGIN PGP PUBLIC KEY BLOCK/.test(ref)) {
        armored = ref;
      } else if (!ref && expectedFp) {
        throw new Error("Only fingerprint in DNS — provide PGP=<https://...url.asc>");
      } else {
        return null;
      }

      const actualFp = await fingerprintOfArmored(armored);
      if (!actualFp) throw new Error("Could not read fingerprint from key");

      if (expectedFp) {
        if (!fingerprintsMatch(expectedFp, actualFp)) {
          throw new Error(
            "Fingerprint mismatch! DNS=" + normalizeFp(expectedFp).slice(-16) +
            " key=" + actualFp.slice(-16)
          );
        }
        print("PGP fingerprint OK: " + actualFp.slice(-16), "info");
      } else {
        print("PGP fingerprint (no DNS fp to check): " + actualFp.slice(-16), "warn");
      }
      return armored;
    }

    let remoteUsers = [];
    let currentUser = "guest";
    let session = null;
    let cmdHistory = [];
    let histIdx = -1;
    let busy = false;
    let interactive = null;

    function loadStore() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }
      catch { return {}; }
    }
    function saveStore(obj) { localStorage.setItem(STORAGE_KEY, JSON.stringify(obj)); }

    async function saveSession() {
      if (!session) return;
      const store = loadStore();
      const payload = {
        publicKey: session.publicKey,
        privateKey: session.privateKey,
        activeLoginPass: session.activeLoginPass !== false, // true: the key is protected by the login password
        keys: session.keys || [],                            // other keys (imported / previous)
        email: session.email || null,
        userToken: session.userToken || null,
        userTokenExp: session.userTokenExp || 0,
        messages: session.messages || [],
        created: session.created || Date.now()
      };
      store.users = store.users || {};
      store.users[session.name] = await encryptLocal(session.password, JSON.stringify(payload));
      saveStore(store);
    }
    function sessionFromPayload(name, password, data) {
      return {
        name: name, password: password,
        publicKey: data.publicKey, privateKey: data.privateKey,
        activeLoginPass: data.activeLoginPass !== false,
        keys: data.keys || [],
        email: data.email || null,
        userToken: data.userToken || null,
        userTokenExp: data.userTokenExp || 0,
        messages: data.messages || [], created: data.created
      };
    }
    async function loadUser(name, password) {
      const store = loadStore();
      const users = store.users || {};
      const key = users[name] ? name : Object.keys(users).find(k => k.toLowerCase() === name.toLowerCase());
      if (!key) throw new Error("User not found locally");
      const json = await decryptLocal(password, users[key]);
      return sessionFromPayload(key, password, JSON.parse(json));
    }
    function listLocalUserNames() {
      return Object.keys(loadStore().users || {});
    }

    const term = document.getElementById("terminal");
    const inputRow = document.getElementById("inputRow");
    const input = document.getElementById("cmd");
    const promptLabel = document.getElementById("promptLabel");
    const windowTitle = document.getElementById("windowTitle");

    function appendBeforePrompt(node) {
      term.insertBefore(node, inputRow);
      term.scrollTop = term.scrollHeight;
    }
    function print(text, cls) {
      const div = document.createElement("div");
      div.className = "line " + (cls || "out");
      div.textContent = text;
      appendBeforePrompt(div);
    }
    function printHtml(html, cls) {
      const div = document.createElement("div");
      div.className = "line " + (cls || "out");
      div.innerHTML = html;
      appendBeforePrompt(div);
    }
    function printPromptLine(cmd) {
      const div = document.createElement("div");
      div.className = "line cmd";
      div.innerHTML = '<span class="prompt">' + escapeHtml(promptText()) + '</span> ' + escapeHtml(cmd);
      appendBeforePrompt(div);
    }
    function escapeHtml(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }
    function promptText() { return currentUser + "@" + DOMAIN + ":~$"; }
    function refreshPrompt() {
      promptLabel.textContent = promptText();
      windowTitle.textContent = currentUser + "@" + DOMAIN + " — bash";
    }
    function clearScreen() {
      Array.from(term.children).forEach(function (el) {
        if (el !== inputRow) el.remove();
      });
    }

    function parseUserRecord(txt) {
      if (typeof txt !== "string" || txt.indexOf("usr=") === -1) return null;
      // Value runs until the next known label= (so "role=organization owner" keeps both words)
      const LABELS = "usr|role|PGP|pgp|fp|fingerprint|pgpfp|PGPFP";
      function get(key) {
        const re = new RegExp(
          "(?:^|\\s)" + key + "=(.+?)(?=\\s+(?:" + LABELS + ")=|$)",
          "i"
        );
        const m = txt.match(re);
        return m ? m[1].trim() : null;
      }
      const usr = get("usr");
      if (!usr) return null;
      // PGP= may be URL or (rarely) inline; fp= / fingerprint= / pgpfp= is the DNS fingerprint
      const pgpRaw = get("PGP") || get("pgp") || null;
      const pgpFp = get("fp") || get("fingerprint") || get("pgpfp") || get("PGPFP") || null;
      let pgpUrl = null;
      let pgpInline = null;
      if (pgpRaw) {
        if (/^https?:\/\//i.test(pgpRaw)) pgpUrl = pgpRaw;
        else if (/BEGIN/.test(pgpRaw)) pgpInline = pgpRaw;
        else if (!pgpFp && /^[0-9a-fA-F]{16,40}$/.test(pgpRaw.replace(/\s/g, ""))) {
          return {
            name: usr,
            role: get("role") || "user",
            pgp: null,
            pgpUrl: null,
            pgpFp: pgpRaw,
            source: "REMOTE"
          };
        } else {
          pgpUrl = pgpRaw;
        }
      }
      return {
        name: usr,
        role: get("role") || "user",
        pgp: pgpInline || pgpUrl,
        pgpUrl: pgpUrl,
        pgpFp: pgpFp,
        source: "REMOTE"
      };
    }

    async function loadRemoteUsers() {
      print("DNS TXT query: " + DOMAIN + " ...", "sys");
      try {
        const txts = await queryTXT(DOMAIN);
        remoteUsers = [];
        for (const t of txts) {
          const u = parseUserRecord(t);
          if (u) remoteUsers.push(u);
          String(t).split(/[|;]/).forEach(function (part) {
            const u2 = parseUserRecord(part.trim());
            if (u2 && !remoteUsers.find(function (x) { return x.name === u2.name; })) remoteUsers.push(u2);
          });
        }
        for (const u of remoteUsers) {
          try { if (u.pgp && /BEGIN PGP/.test(u.pgp)) await primeFingerprint(u.pgp); } catch (e) {}
        }
        print("  " + remoteUsers.length + " user record(s) found.", "sys");
      } catch (e) {
        print("DNS error: " + (e.message || e), "warn");
        remoteUsers = [];
      }
    }

    function findUser(name) {
      const n = name.toLowerCase();
      if (session && session.name.toLowerCase() === n) {
        return { name: session.name, role: "local", pgp: session.publicKey, source: "LOCAL" };
      }
      const localName = listLocalUserNames().find(function (x) { return x.toLowerCase() === n; });
      if (localName) return { name: localName, role: "local", pgp: null, source: "LOCAL" };
      return remoteUsers.find(function (u) { return u.name.toLowerCase() === n; }) || null;
    }

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/i.test(email);
    }

    async function doSendMessage(to, body) {
      if (!session) { print("Guests cannot send messages. Use: register <name> or login <name>", "err"); return; }
      if (!session.email) {
        print("This local account is not registered on the server. Use nuke, then register.", "err");
        return;
      }
      if (!hasUserToken()) {
        print("Your session is not verified. Log in again (an emailed code is needed).", "err");
        return;
      }
      if (!body.trim()) { print("Message cannot be empty.", "err"); return; }

      const target = findUser(to);
      let ciphertext = null;
      let usedPgp = false;

      if (target && (target.pgp || target.pgpUrl || target.pgpFp)) {
        try {
          print("Resolving recipient PGP key...", "sys");
          const armored = await resolveRecipientPublicKey(target);
          if (armored) {
            print("Encrypting with recipient PGP key...", "sys");
            ciphertext = await encryptMessage(body, armored);
            usedPgp = true;
          } else {
            print("No usable PGP key for recipient — plaintext.", "sys");
          }
        } catch (e) {
          print("PGP key/encrypt failed: " + (e.message || e), "err");
          print("Sending as plaintext.", "warn");
        }
      } else {
        print("No known PGP key for recipient — plaintext.", "sys");
      }

      const payload = {
        to: to,
        message: ciphertext || body,
        encrypted: usedPgp,
        sender_pubkey: session.publicKey,
        source: "zedon.tech-terminal",
        timestamp: new Date().toISOString(),
        user_token: session.userToken
      };

      const size = new TextEncoder().encode(payload.message).length;
      const entry = { ts: Date.now(), to: to, from: session.email, size: size, encrypted: usedPgp, body: payload.message.slice(0, 2000) };
      session.messages = session.messages || [];
      session.messages.push(entry);
      await saveSession();

      print("Sending → " + to + "  (" + size + " B" + (usedPgp ? ", PGP" : "") + ") ...", "sys");
      busy = true;
      input.disabled = true;
      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          print("Message sent. ✓  (also saved locally)", "info");
        } else {
          const txt = await res.text().catch(function () { return ""; });
          let data = {};
          try { data = JSON.parse(txt); } catch (e) {}
          if (res.status === 401 && data.reason === "user_token") {
            session.userToken = null;
            session.userTokenExp = 0;
            await saveSession();
            print("Your session expired. Log in again to verify it. Message kept locally, not sent.", "warn");
          } else {
            print("Worker error (" + res.status + "). Message kept locally.", "warn");
            const shown = data.error || txt;
            if (shown) print(String(shown).slice(0, 180), "err");
          }
        }
      } catch (e) {
        print("Network error — message saved locally.", "warn");
        print(String(e.message || e), "err");
      } finally {
        busy = false;
        input.disabled = false;
        input.focus();
      }
    }

    // ───────────── PWA install tracking ─────────────
    // State lives in localStorage (INSTALL_KEY) as { installed, ts, via }.
    // It is a best-effort flag, kept honest by three signals:
    //   • running in standalone/app mode        → installed = true
    //   • "appinstalled" event                  → installed = true
    //   • "beforeinstallprompt" fires in a tab  → browser says NOT installed → installed = false
    let deferredPrompt = null;

    function loadInstall() {
      try { return JSON.parse(localStorage.getItem(INSTALL_KEY) || "{}"); }
      catch (e) { return {}; }
    }
    function saveInstall(obj) {
      try { localStorage.setItem(INSTALL_KEY, JSON.stringify(obj)); } catch (e) {}
    }
    function markInstalled(via) {
      saveInstall({ installed: true, ts: Date.now(), via: via });
    }
    function markNotInstalled() {
      try { localStorage.removeItem(INSTALL_KEY); } catch (e) {}
    }
    function isStandalone() {
      return ["standalone", "fullscreen", "minimal-ui", "window-controls-overlay"].some(function (m) {
        return window.matchMedia("(display-mode: " + m + ")").matches;
      }) || navigator.standalone === true ||
        (document.referrer || "").indexOf("android-app://") === 0;
    }
    function isIOS() {
      return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    }
    function isAndroid() { return /android/i.test(navigator.userAgent); }
    function installState() {
      const st = loadInstall();
      return {
        running: isStandalone(),
        flagged: !!st.installed,
        ts: st.ts || null,
        via: st.via || null,
        promptable: !!deferredPrompt
      };
    }
    function fmtTs(ts) {
      return ts ? new Date(ts).toISOString().replace("T", " ").slice(0, 19) : "?";
    }

    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      deferredPrompt = e;
      // The browser only offers installation when the app is NOT installed → clear a stale flag.
      if (loadInstall().installed && !isStandalone()) markNotInstalled();
    });
    window.addEventListener("appinstalled", function () {
      deferredPrompt = null;
      markInstalled("appinstalled");
      print("App installed. ✓", "info");
    });
    try {
      window.matchMedia("(display-mode: standalone)").addEventListener("change", function (e) {
        if (e.matches) markInstalled("standalone");
      });
    } catch (e) {}
    if (isStandalone()) markInstalled("standalone");

    function printManualInstallHelp() {
      if (isIOS()) {
        print("iOS has no install API. Do it by hand:", "sys");
        print("  Share (□↑) → Add to Home Screen");
      } else {
        print("The browser did not offer an install prompt.", "warn");
        print("Use the browser menu → 'Install app' / 'Add to Home screen'.", "sys");
        print("(Not every browser can install web apps, and nothing is offered if it is already installed.)", "sys");
      }
    }

    async function runInstall() {
      if (!deferredPrompt) { printManualInstallHelp(); return; }
      const dp = deferredPrompt;
      deferredPrompt = null; // the event is single-use
      busy = true;
      input.disabled = true;
      try {
        print("Waiting for the browser's install dialog...", "sys");
        dp.prompt();
        const choice = await dp.userChoice;
        if (choice && choice.outcome === "accepted") {
          markInstalled("prompt");
          print("Install accepted. ✓", "info");
        } else {
          print("Install dismissed.", "warn");
          print("Run 'install' again later; the browser may offer it again after a reload.", "sys");
        }
      } catch (e) {
        print("Install error: " + (e.message || e), "err");
      } finally {
        busy = false;
        input.disabled = false;
        input.focus();
      }
    }

    async function runUninstall() {
      let swCount = 0, cacheCount = 0;
      try {
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function (r) { return r.unregister(); }));

    async function handleInteractive(line) {
      const t = line.trim();
      if (t.toLowerCase() === "cancel") {
        resetInteractive();
        print("Cancelled.", "warn");
        return;
      }
      const step = interactive.step;
      const d = interactive.data;

      if (step === "reg_email1") {
        if (!isValidEmail(t)) { print("Invalid email address.", "err"); return; }
        d.email1 = t;
        interactive.step = "reg_email2";
        print("Repeat the email address:");
        promptLabel.textContent = "email again>";
        return;
      }
      if (step === "reg_email2") {
        if (t.toLowerCase() !== d.email1.toLowerCase()) {
          print("The two addresses do not match. Enter the email address again:", "err");
          interactive.step = "reg_email1";
          promptLabel.textContent = "email>";
          return;
        }
        d.email = d.email1;
        if (!(await requestRegisterOtp(d))) {
          print("Registration aborted, nothing was saved.", "warn");
          resetInteractive();
          return;
        }
        interactive.step = "reg_pass";
        print("Choose a password (min 6 chars, protects key + data):");
        promptLabel.textContent = "password>";
        input.type = "password";
        return;
      }
      if (step === "reg_pass") {
        if (t.length < 6) { print("Password too short (min 6).", "err"); return; }
        d.password = t;
        interactive.step = "reg_pass2";
        print("Confirm password:");
        promptLabel.textContent = "confirm>";
        return;
      }
      if (step === "reg_pass2") {
        if (t !== d.password) {
          print("Mismatch. Restart with: register " + d.name, "err");
          resetInteractive();
          return;
        }
        print("Generating PGP keypair (curve25519)...", "sys");
        busy = true;
        try {
          d.keys = await generatePGPKey(d.name, d.name + "@" + DOMAIN, d.password);
          d.fp = await primeFingerprint(d.keys.publicKey);
          if (!d.fp) throw new Error("could not compute the key fingerprint");
        } catch (e) {
          print("Keygen error: " + (e.message || e), "err");
          busy = false;
          resetInteractive();
          return;
        }
        busy = false;
        interactive.step = "reg_otp";
        input.type = "text";
        print("Key fingerprint: " + fingerprintShort(d.keys.publicKey), "sys");
        print("Enter the 6-digit code from the email ('resend' for a new one):");
        promptLabel.textContent = "code>";
        return;
      }
      if (step === "reg_otp") {
        if (t.toLowerCase() === "resend") {
          if (await requestRegisterOtp(d)) print("Enter the new code:");
          return;
        }
        if (!/^\d{6}$/.test(t)) { print("The code is 6 digits ('resend' for a new one).", "err"); return; }
        busy = true;
        input.disabled = true;
        let done = false;
        try {
          const tok = await getSessionToken(false);
          const r = await registryCall("/register/verify", {
            name: d.name, email: d.email, otp: t,
            public_key: d.keys.publicKey, fingerprint: d.fp, ip_hash: d.ipHash, token: tok
          });
          if (r.ok) {
            session = {
              name: d.name, password: d.password,
              publicKey: d.keys.publicKey, privateKey: d.keys.privateKey, activeLoginPass: true, keys: [],
              email: d.email, userToken: r.data.user_token, userTokenExp: r.data.exp,
              messages: [], created: Date.now()
            };
            await saveSession();
            currentUser = d.name;
            print("Done. Registered and logged in as: " + d.name, "info");
            print("Public key saved on the server, fingerprint: " + fingerprintShort(d.keys.publicKey), "sys");
            print("Key and messages are password-protected in this browser.");
            done = true;
          } else if (r.status === 400 && r.data.reason === "otp") {
            print("Wrong code" + (typeof r.data.attempts_left === "number" ? " (" + r.data.attempts_left + " attempt(s) left)" : "") + ". Try again or type 'resend'.", "err");
          } else if (r.status === 410) {
            print("The code expired or there were too many wrong attempts. Type 'resend' for a new code.", "err");
          } else if (r.status === 409) {
            print("Name '" + d.name + "' was just taken. Registration aborted.", "err");
            print("Nothing was saved locally.", "warn");
            done = true;
          } else {
            if (r.status === 401) clearToken();
            print("Registry error (" + r.status + ")" + (r.data.error ? ": " + r.data.error : "") + ". Try again.", "err");
          }
        } catch (e) {
          print("Verification failed: " + (e.message || e), "err");
        } finally {
          busy = false;
          input.disabled = false;
          input.focus();
        }
        if (done) resetInteractive();
        return;
      }
      if (step === "restore_confirm") {
        if (t !== "YES") { print("Restore aborted. (You must type YES in capitals.)", "warn"); resetInteractive(); return; }
        await beginRestore(d.name);
        return;
      }
      if (step === "restore_otp") {
        if (t.toLowerCase() === "resend") {
          if (await requestLoginOtp(d.name, "the email address registered for this account")) print("Enter the new code:");
          return;
        }
        if (!/^\d{6}$/.test(t)) { print("The code is 6 digits ('resend' for a new one).", "err"); return; }
        busy = true;
        input.disabled = true;
        try {
          const tok = await getSessionToken(false);
          const r = await registryCall("/login/verify", { name: d.name, otp: t, token: tok });
          if (r.ok) {
            d.name = r.data.name || d.name;
            d.userToken = r.data.user_token;
            d.exp = r.data.exp;
            d.email = r.data.email;
            d.fp = normalizeFp(r.data.fingerprint);
            print("Verified. ✓  The account is yours.", "info");
            print("Choose a NEW password for this device (min 6 chars). It only protects the keys stored in this browser:");
            interactive.step = "restore_pass";
            promptLabel.textContent = "password>";
            input.type = "password";
          } else if (r.status === 400 && r.data.reason === "otp") {
            print("Wrong code" + (typeof r.data.attempts_left === "number" ? " (" + r.data.attempts_left + " attempt(s) left)" : "") + ". Try again or type 'resend'.", "err");
          } else if (r.status === 410) {
            print("The code expired or there were too many wrong attempts. Type 'resend' for a new code.", "err");
          } else {
            if (r.status === 401) clearToken();
            print("Registry error (" + r.status + ")" + (r.data.error ? ": " + r.data.error : "") + ". Try again.", "err");
          }
        } catch (e) {
          print("Verification failed: " + (e.message || e), "err");
        } finally {
          busy = false;
          input.disabled = false;
          input.focus();
        }
        return;
      }
      if (step === "restore_pass") {
        if (t.length < 6) { print("Password too short (min 6).", "err"); return; }
        d.password = t;
        interactive.step = "restore_pass2";
        print("Confirm password:");
        promptLabel.textContent = "confirm>";
        return;
      }
      if (step === "restore_pass2") {

          interactive.step = "restore_pass";
          promptLabel.textContent = "password>";
          return;
        }
        interactive.step = "restore_choice";
        input.type = "text";
        promptLabel.textContent = "restore>";
        printRestoreOptions(d);
        return;
      }
      if (step === "restore_choice") {
        const c = t.toLowerCase();
        if (c === "import") { openImportPanel({ restore: d }); return; }
        if (c === "newkey") {
          print("A NEW key replaces the registered public key. Messages encrypted to the OLD key can no", "warn");
          print("longer be read on any device unless you find the old key file.", "warn");
          interactive.step = "restore_newkey_confirm";
          print("Create a new key and replace the registered one? Are you sure? (type 'YES')", "warn");
          promptLabel.textContent = "confirm>";
          return;
        }
        print("Type 'import', 'newkey' or 'cancel'.", "err");
        return;
      }
      if (step === "restore_newkey_confirm") {
        if (t !== "YES") {
          print("Aborted.", "warn");
          interactive.step = "restore_choice";
          promptLabel.textContent = "restore>";
          printRestoreOptions(d);
          return;
        }
        print("Generating PGP keypair (curve25519)...", "sys");
        busy = true;
        input.disabled = true;
        let keys = null;
        try {
          keys = await generatePGPKey(d.name, d.name + "@" + DOMAIN, d.password);
          const fp = await primeFingerprint(keys.publicKey);
          if (!fp) throw new Error("could not compute the key fingerprint");
          const r = await registryCall("/keys/update", { public_key: keys.publicKey, fingerprint: fp, user_token: d.userToken });
          if (!r.ok) {
            print("The registry refused the new key (" + r.status + ")" + (r.data.error ? ": " + r.data.error : "") + ".", "err");
            keys = null;

        } catch (e) {

          input.type = "text";
          promptLabel.textContent = "restore>";

      if (step === "login_pass") {
        let needOtp = false;
        try {
          session = await loadUser(d.name, t);
          await primeFingerprint(session.publicKey);

          currentUser = session.name;
          refreshPrompt();

            print("This local account is not registered on the server (created before email verification).", "warn");
            print("Sending messages is disabled. Use nuke, then register.", "warn");
          } else {
            needOtp = !hasUserToken();
          }
        } catch (e) {
          print("Wrong password or corrupted data.", "err");
        }
        if (needOtp) { await startLoginOtp(); return; }
        resetInteractive();
        return;
      }
      if (step === "login_otp") {
        if (t.toLowerCase() === "resend") { await startLoginOtp(); return; }
        if (!/^\d{6}$/.test(t)) { print("The code is 6 digits ('resend' for a new one).", "err"); return; }
        busy = true;
        input.disabled = true;
        let done = false;
        try {
          const tok = await getSessionToken(false);
          const r = await registryCall("/login/verify", { name: session.name, otp: t, token: tok });
          if (r.ok) {
            session.userToken = r.data.user_token;
            session.userTokenExp = r.data.exp;
            await saveSession();
            print("Verified. ✓  You can send messages now.", "info");
            done = true;
          } else if (r.status === 400 && r.data.reason === "otp") {
            print("Wrong code" + (typeof r.data.attempts_left === "number" ? " (" + r.data.attempts_left + " attempt(s) left)" : "") + ". Try again or type 'resend'.", "err");
          } else if (r.status === 410) {
            print("The code expired or there were too many wrong attempts. Type 'resend' for a new code.", "err");
          } else {
            if (r.status === 401) clearToken();
            print("Registry error (" + r.status + ")" + (r.data.error ? ": " + r.data.error : "") + ". Try again.", "err");
          }
        } catch (e) {
          print("Verification failed: " + (e.message || e), "err");
        } finally {
          busy = false;
          input.disabled = false;
          input.focus();
        }
        if (done) resetInteractive();
        return;
      }
      if (step === "msg_to") {
        if (!t) { print("Enter a recipient.", "err"); return; }
        d.to = t;
        interactive.step = "msg_body";
        print("Message (Enter to send):");
        promptLabel.textContent = "msg>";
        return;
      }
      if (step === "msg_body") {
        interactive = null;
        refreshPrompt();
        await doSendMessage(d.to, t);
        return;
      }
      if (step === "install_confirm") {
        interactive = null;
        refreshPrompt();
        if (t === "YES") {
          await runInstall();
        } else {
          print("Install aborted. (You must type YES in capitals.)", "warn");
        }
        return;
      }
      if (step === "uninstall_confirm") {
        interactive = null;
        refreshPrompt();
        if (t === "YES") {
          busy = true;
          try { await runUninstall(); }
          finally { busy = false; input.focus(); }
        } else {
          print("Uninstall aborted. (You must type YES in capitals.)", "warn");
        }
        return;
      }
      if (step === "nuke_confirm") {
        interactive = null;
        refreshPrompt();
        if (t === "YES") {
          localStorage.removeItem(STORAGE_KEY);
          clearToken();
          session = null;
          currentUser = "guest";
          cmdHistory = [];
          histIdx = -1;
          refreshPrompt();
          print("All local data wiped. You are guest again.", "info");
        } else {
          print("Nuke aborted. (You must type YES in capitals.)", "warn");
        }
      }
    }

    function downloadText(filename, text) {
      const blob = new Blob([text], { type: "application/pgp-keys; charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        URL.revokeObjectURL(url);
        a.remove();
      }, 500);
    }

    // Keys available for decryption: the registered (active) key first, then imported / previous ones.
    function decodeKeyList() {
      const list = [];
      if (!session) return list;
      if (session.privateKey) {
        list.push({ label: "registered", publicKey: session.publicKey, privateKey: session.privateKey, loginPass: session.activeLoginPass !== false });
      }
      (session.keys || []).forEach(function (k) {
        list.push({ label: k.label || "imported", publicKey: k.publicKey, privateKey: k.privateKey, loginPass: !!k.loginPass });
      });
      return list;
    }
    function updateDecodePassUi() {
      const sel = document.getElementById("decodeKey");
      const k = decodeKeyList()[parseInt(sel.value, 10) || 0];
      const label = document.getElementById("decodePassLabel");
      const pass = document.getElementById("decodePass");
      if (k && k.loginPass) {
        label.textContent = "Passphrase (optional — leave empty to use your login password)";
        pass.placeholder = "Leave empty → use login password";
      } else {
        label.textContent = "Passphrase of this key (may differ from your login password; empty only if the key is not protected)";
        pass.placeholder = "Key passphrase";
      }
    }
    function openDecodePanel() {
      document.getElementById("decodeModal").classList.add("open");
      document.getElementById("decodeCipher").value = "";
      document.getElementById("decodePass").value = "";
      const res = document.getElementById("decodeResult");
      res.classList.remove("show");
      res.textContent = "";

      const info = document.getElementById("decodeKeyInfo");
      const passWrap = document.getElementById("decodePassWrap");
      const keyWrap = document.getElementById("decodeKeyWrap");
      const sel = document.getElementById("decodeKey");

      const keys = decodeKeyList();
      if (session && keys.length) {
        info.textContent = "Logged in as " + session.name + "  ·  " + keys.length + " key(s) available";
        info.style.color = "#8cf";
        sel.innerHTML = "";
        keys.forEach(function (k, i) {
          const o = document.createElement("option");
          o.value = String(i);
          o.textContent = k.label + " · " + fingerprintShort(k.publicKey) + (k.loginPass ? "" : " · own passphrase");
          sel.appendChild(o);
        });
        sel.onchange = updateDecodePassUi;
        keyWrap.style.display = "";
        passWrap.style.display = "";
        updateDecodePassUi();
      } else {
        info.textContent = "No key loaded. Run: login <name>  or  register <name>";
        info.style.color = "#ffaa00";
        keyWrap.style.display = "none";
        passWrap.style.display = "none";
      }
    }
    function closeDecodePanel() {
      document.getElementById("decodeModal").classList.remove("open");
      input.focus();
    }
    document.getElementById("decodeCancel").onclick = closeDecodePanel;
    document.getElementById("decodeRun").onclick = async function () {
      const cipher = document.getElementById("decodeCipher").value.trim();
      const passInput = document.getElementById("decodePass").value;
      const resEl = document.getElementById("decodeResult");
      const show = function (msg) { resEl.textContent = msg; resEl.classList.add("show"); };
      if (!cipher) { show("No ciphertext."); return; }
      const keys = decodeKeyList();
      if (!session || !keys.length) { show("No key in session. Use: login <name> or register <name>"); return; }
      const k = keys[parseInt(document.getElementById("decodeKey").value, 10) || 0];
      // Registered key: the passphrase defaults to the login password. Imported keys keep their own passphrase.
      const passphrase = passInput || (k.loginPass ? session.password : "");
      try {
        show(await decryptMessage(cipher, k.privateKey, passphrase));
      } catch (e) {
        show("Decrypt failed: " + (e.message || e) + "\n\n" + (k.loginPass
          ? "Tip: leave the passphrase empty to use your login password, or enter the key passphrase."
          : "Tip: enter the passphrase of this imported key (it may differ from your login password), and make sure the message was encrypted to this key."));
      }
    };

    function openImportPanel(opts) {
      const restore = opts && opts.restore ? opts.restore : null;
      if (!restore && !session) { print("Login required. Use: login <name>", "err"); return; }
      restoreCtx = restore;
      document.getElementById("importKey").value = "";
      document.getElementById("importPass").value = "";
      document.getElementById("importPublish").checked = !restore;
      document.getElementById("importPublishRow").style.display = restore ? "none" : "";
      const res = document.getElementById("importResult");
      res.classList.remove("show");
      res.textContent = "";
      document.getElementById("importInfo").textContent = restore
        ? "Restoring '" + restore.name + "': paste the private key whose fingerprint ends with " + restore.fp.slice(-16) +
          " (the file " + restore.name + "-private.asc). Enter that key's own passphrase (usually your OLD password). Nothing is uploaded."
        : "Active key: " + fingerprintShort(session.publicKey) + "  ·  the imported key keeps its OWN passphrase; you enter it in decode. It is never uploaded.";
      document.getElementById("importModal").classList.add("open");
    }
    function closeImportPanel() {
      document.getElementById("importModal").classList.remove("open");
      input.focus();
    }
    document.getElementById("importCancel").onclick = closeImportPanel;
    document.getElementById("importRun").onclick = async function () {
      const resEl = document.getElementById("importResult");
      const say = function (m) { resEl.textContent = m; resEl.classList.add("show"); };
      const btn = document.getElementById("importRun");
      const armored = document.getElementById("importKey").value.trim();
      const pass = document.getElementById("importPass").value;
      const publish = document.getElementById("importPublish").checked;
      if (!/BEGIN PGP PRIVATE KEY BLOCK/.test(armored)) { say("This is not an armored PGP private key."); return; }
      const rc = restoreCtx;
      if (rc) {
        // New-device restore: the key must be the one the account was registered with.
        btn.disabled = true;
        try {
          const key = await openpgp.readPrivateKey({ armoredKey: armored });
          if (!key.isDecrypted()) {
            try { await openpgp.decryptKey({ privateKey: key, passphrase: pass }); }
            catch (e) { say("Wrong passphrase for this key."); return; }
          }
          const fp = key.getFingerprint().toUpperCase();
          if (fp !== rc.fp) {
            say("This key does not match the account: registered ..." + rc.fp.slice(-16) + ", this one ..." + fp.slice(-16) +
                ". Use the key file exported from '" + rc.name + "'.");
            return;
          }
          const publicKey = key.toPublic().armor();
          fpCache.set(publicKey, fp);
          closeImportPanel();
          await finishRestore(rc, publicKey, armored, pass !== "" && pass === rc.password);
        } catch (e) {
          say("Import failed: " + (e.message || e));
        } finally {
          btn.disabled = false;
        }
        return;
      }
      if (!session) { say("Login required."); return; }
      if (publish && !hasUserToken()) { say("Publishing needs a verified session. Log in again (emailed code) or untick the option."); return; }
      btn.disabled = true;
      try {
        const key = await openpgp.readPrivateKey({ armoredKey: armored });
        if (!key.isDecrypted()) {
          try { await openpgp.decryptKey({ privateKey: key, passphrase: pass }); }
          catch (e) { say("Wrong passphrase for this key."); return; }
        }
        const fp = key.getFingerprint().toUpperCase();
        const activeFp = await primeFingerprint(session.publicKey);
        if (fp === activeFp || (session.keys || []).some(function (k) { return k.fp === fp; })) {
          say("This key is already in your account.");
          return;
        }
        const publicKey = key.toPublic().armor();
        if (publish) {
          const r = await registryCall("/keys/update", { public_key: publicKey, fingerprint: fp, user_token: session.userToken });
          if (!r.ok) {
            if (r.status === 401) { session.userToken = null; session.userTokenExp = 0; await saveSession(); }
            say("The registry refused the key (" + r.status + ")" + (r.data.error ? ": " + r.data.error : "") + ".");
            return;
          }
          // the previously registered key stays available for decrypting old messages
          session.keys = session.keys || [];
          session.keys.push({ fp: activeFp, label: "previous", publicKey: session.publicKey, privateKey: session.privateKey, loginPass: session.activeLoginPass !== false, added: Date.now() });
          session.publicKey = publicKey;
          session.privateKey = armored;
          session.activeLoginPass = false;
        } else {
          session.keys = session.keys || [];
          session.keys.push({ fp: fp, label: "imported", publicKey: publicKey, privateKey: armored, loginPass: false, added: Date.now() });
        }
        fpCache.set(publicKey, fp);
        await saveSession();
        print("Key imported: " + fp.slice(-16) + (publish ? "  (now your registered key, public part saved on the server)" : ""), "info");
        print("Its passphrase is not stored: enter it in decode.", "sys");
        closeImportPanel();
      } catch (e) {
        say("Import failed: " + (e.message || e));
      } finally {
        btn.disabled = false;
      }
    };

    function runCommand(raw) {
      const line = raw;
      const trimmed = line.trim();

      if (interactive) {
        printPromptLine(input.type === "password" ? "********" : line);
        handleInteractive(line);
        return;
      }

      if (!trimmed) return;

      cmdHistory.push(trimmed);
      histIdx = cmdHistory.length;
      printPromptLine(trimmed);

      const parts = trimmed.split(/\s+/);
      const cmd = parts[0].toLowerCase();
      const args = parts.slice(1);

      if (commands[cmd]) {
        const r = commands[cmd](args);
        if (r && typeof r.then === "function") { /* async */ }
      } else {
        print("command not found: " + cmd, "err");
        print("Type: help", "sys");
      }
    }

    input.addEventListener("keydown", function (e) {
      if (busy) { e.preventDefault(); return; }
      if (e.key === "Enter") {
        e.preventDefault();
        const val = input.value;
        input.value = "";
        runCommand(val);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (histIdx > 0) {
          histIdx--;
          input.value = cmdHistory[histIdx] || "";
          setTimeout(function () { input.setSelectionRange(input.value.length, input.value.length); }, 0);
        }
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        if (histIdx < cmdHistory.length - 1) {
          histIdx++;
          input.value = cmdHistory[histIdx] || "";
        } else {
          histIdx = cmdHistory.length;
          input.value = "";
        }
      } else if (e.key === "c" && e.ctrlKey) {
        if (interactive) {
          resetInteractive();
          print("^C", "warn");
          print("Cancelled.", "warn");
          input.value = "";
        }
      } else if (e.key === "l" && e.ctrlKey) {
        e.preventDefault();
        clearScreen();
      }
    });

    document.addEventListener("click", function (e) {
      if (!e.target.closest(".modal") && !busy) input.focus();
    });

    refreshPrompt();
    print("zedon.tech terminal", "sys");
    print("Type 'help' for available commands.", "sys");
    print("");
    await loadRemoteUsers();
    print("");
    input.focus();
  })();
  </script>
