<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#4caf50" />
  <meta name="description" content="zedon.tech terminal" />
  <title>zedon.tech — terminal</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="android-chrome-512x512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <script src="https://unpkg.com/openpgp@5.11.2/dist/openpgp.min.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #33ff66;
      --dim: #1a3a22;
      --accent: #00cc55;
      --error: #ff5555;
      --warn: #ffaa00;
      --prompt: #66ff99;
      --cursor: #33ff66;
      --panel: #111;
      --border: #1f3a28;
      --font: "SF Mono", "Fira Code", "Cascadia Code", "JetBrains Mono", "Consolas", "Liberation Mono", Menlo, Monaco, monospace;
      --fs-base: clamp(13px, 1.55vw, 16.5px);
      --line-h: 1.45;
      --nc-fs: var(--fs-base);   /* font size of the dialogs (16px on phones: no zoom-on-focus) */
      --pad: clamp(10px, 2.2vw, 26px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      font-size: var(--fs-base);
      line-height: var(--line-h);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    body { display: flex; flex-direction: column; padding: var(--pad); }
    .term-window {
      flex: 1; display: flex; flex-direction: column;
      border: 1px solid var(--dim); border-radius: 10px; overflow: hidden;
      background: #050505;
      box-shadow: 0 0 0 1px rgba(51,255,102,.06), 0 20px 60px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.03);
      max-width: 1100px; width: 100%; margin: 0 auto; min-height: 0; position: relative;
    }
    .titlebar {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      background: linear-gradient(180deg,#141414,#0d0d0d); border-bottom: 1px solid var(--dim);
      user-select: none; flex-shrink: 0;
    }
    .title-icon {
      width: 48px; height: 48px; flex-shrink: 0;
      fill: var(--accent); opacity: 0.95;
    }
    .title {
      flex: 1; text-align: center; font-size: .9em; color: #aaa;
      letter-spacing: .03em; font-weight: 500;
    }
    #terminal {
      flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px 18px 18px;
      scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
    }
    #terminal::-webkit-scrollbar { width: 8px; }
    #terminal::-webkit-scrollbar-track { background: transparent; }
    #terminal::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 4px; }
    .line { white-space: pre-wrap; word-break: break-word; margin-bottom: 2px; }
    .line.cmd { color: var(--fg); }
    .line.out { color: #b8f0c8; }
    .line.err { color: var(--error); }
    .line.warn { color: var(--warn); }
    .line.sys { color: #6a9; }
    .line.info { color: #8cf; }
    .line.gold { color: var(--warn); }                 /* the golden brown also used for panel titles and warnings */
    /* help: command name (gold) + description in their own columns, so wrapped text keeps a hanging indent */
    .line.help-row { display: flex; gap: 1ch; padding-left: 2ch; white-space: normal; }
    .help-cmd { flex: none; width: 17ch; color: var(--warn); white-space: pre; }
    .help-desc { flex: 1 1 auto; min-width: 0; word-break: break-word; }
    .line a.term-link {
      color: #6cf; text-decoration: underline; word-break: break-all;
    }
    .line a.term-link:hover { color: #9df; }
    .prompt { color: var(--prompt); font-weight: 500; }
    .input-row {
      display: flex; align-items: baseline; gap: 0; margin-top: 2px;
    }
    .input-row .prompt { white-space: nowrap; margin-right: 6px; }
    #cmd {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--fg); font-family: inherit; font-size: inherit; line-height: inherit;
      caret-color: var(--cursor); min-width: 0; padding: 0;
    }
    .modal-overlay {
      display: none; position: absolute; top: 0; left: 0; right: 0; height: min(100%, var(--vvh, 100%)); background: rgba(0,0,0,.72);
      z-index: 50; align-items: center; justify-content: center; padding: 8px;
    }
    .modal-overlay.open { display: flex; }
    /* Norton Commander style dialogs, in the terminal's own palette. The frame is made of box-drawing characters (see ncLayout). */
    .nc {
      --cols: 76;
      width: calc(var(--cols) * 1ch); max-width: 100%; max-height: 96%;
      display: flex; flex-direction: column;
      background: var(--dim); color: var(--fg);
      font-family: var(--font); font-size: var(--nc-fs); line-height: 1.3;
      box-shadow: 2ch 1.2em 0 rgba(0, 0, 0, .85);
    }
    .nc.big { height: 92%; max-height: 100%; }   /* the big dialogs use most of the window; only the human check stays small */
    .nc-probe { position: absolute; visibility: hidden; pointer-events: none; width: 1ch; height: 1em; font-family: var(--font); font-size: var(--nc-fs); }
    .nc-row { flex: none; color: var(--prompt); white-space: pre; overflow: hidden; line-height: normal; }  /* box glyphs tile exactly at the font's natural line height */
    .nc-row .nc-ttl { color: var(--warn); }
    .nc-mid { flex: 1 1 auto; min-height: 0; display: flex; }
    .nc-side { flex: none; width: 1ch; position: relative; overflow: hidden; color: var(--prompt); white-space: pre; line-height: normal; }
    .nc-side span { position: absolute; top: 0; left: 0; }  /* out of the flow: the column stretches to the body, it never sizes it */
    .nc-body {
      flex: 1 1 auto; min-width: 0; padding: .4em 1ch; overflow-y: auto;
      display: flex; flex-direction: column; scrollbar-width: thin; scrollbar-color: var(--accent) var(--dim);
    }
    .nc label { display: block; color: var(--prompt); margin: .3em 0 .15em; }
    .nc .nc-info { color: var(--fg); margin-bottom: .5em; }
    .nc .nc-info.nc-warn { color: var(--warn); }
    .nc textarea, .nc input[type="text"], .nc input[type="password"], .nc select {
      display: block; width: 100%; background: var(--bg); color: var(--prompt); border: 0; border-radius: 0; outline: 0;
      font: inherit; padding: .1em 1ch; margin: 0 0 .5em; caret-color: var(--cursor);
    }
    .nc textarea { min-height: 11em; flex: 1 1 auto; resize: none; }
    .nc textarea:focus, .nc input:focus, .nc select:focus { box-shadow: inset 0 0 0 1px var(--accent); }
    .nc .check { display: flex; align-items: baseline; gap: 1ch; color: var(--fg); margin: .3em 0 .5em; cursor: pointer; }
    .nc .check input {
      -webkit-appearance: none; appearance: none; margin: 0; padding: 0; width: auto; background: none; border: 0;
      color: var(--warn); font: inherit; cursor: pointer; outline: 0; box-shadow: none;
    }
    .nc .check input::before { content: "[ ]"; }
    .nc .check input:checked::before { content: "[x]"; }
    .nc .actions { display: flex; justify-content: center; gap: 3ch; padding: .5em 0 .4em; flex: none; }
    .nc button {
      -webkit-appearance: none; appearance: none; border: 0; border-radius: 0; background: var(--accent); color: var(--bg);
      font: inherit; padding: 0 .5ch; cursor: pointer; box-shadow: .8ch .3em 0 rgba(0, 0, 0, .85);
    }
    .nc button.secondary { background: var(--bg); color: var(--fg); }
    .nc button::before { content: "[ "; }
    .nc button::after { content: " ]"; }
    .nc button:focus-visible { background: var(--warn); color: var(--bg); outline: 0; }
    @media (hover: hover) { .nc button:hover { background: var(--warn); color: var(--bg); } }
    .nc .result {
      display: none; margin-top: .4em; padding: .2em 1ch; background: var(--bg); color: var(--fg);
      white-space: pre-wrap; word-break: break-word; max-height: 12em; overflow-y: auto; flex: none;
    }
    .nc .result.show { display: block; }
    .nc .nc-note { margin: 0 0 .4em; }
    .nc .nc-note div { color: var(--fg); word-break: break-word; }
    .nc .nc-note .nc-alert { background: var(--error); color: var(--bg); padding: 0 1ch; margin-top: .3em; }
    .nc .result.bad { background: var(--error); color: var(--bg); }
    .nc .nc-info.nc-warn, .nc .nc-note .nc-warnline { color: var(--warn); }
    .nc .actions { position: sticky; bottom: 0; background: var(--dim); z-index: 1; }   /* the buttons stay visible while the body scrolls */
    .nc .actions button:disabled { opacity: .45; cursor: default; }
    .nc .nc-hint { color: var(--prompt); text-align: center; margin: 0 0 .3em; flex: none; white-space: pre-wrap; }
    .nc .nc-hint .hint-touch { display: none; }
    @media (hover: none) and (pointer: coarse) { .nc .nc-hint .hint-kb { display: none; } .nc .nc-hint .hint-touch { display: inline; } }
    /* message history: a keyboard-navigable list, the selected item in inverse video, Enter opens it */
    .nc .nc-list {
      flex: 1 1 auto; min-height: 8em; overflow-y: auto; outline: 0; background: var(--bg); margin-bottom: .4em;
      scrollbar-width: thin; scrollbar-color: var(--accent) var(--bg);
    }
    .nc .nc-list:focus { box-shadow: inset 0 0 0 1px var(--accent); }
    .nc .nc-empty { padding: .4em 1ch; color: var(--fg); }
    .nc .nc-item { cursor: pointer; }
    .nc .nc-head { padding: .3em 1ch; }
    .nc .nc-l1, .nc .nc-l2 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nc .nc-l1 { color: var(--prompt); }
    .nc .nc-l2 { color: var(--fg); }
    .nc .nc-l2 .nc-snip { opacity: .65; }
    .nc .nc-item.nc-sel .nc-head { background: var(--fg); }
    .nc .nc-item.nc-sel .nc-head, .nc .nc-item.nc-sel .nc-head * { color: var(--bg); opacity: 1; }   /* inverse video */
    .nc .nc-full { background: var(--dim); padding: .3em 1ch .5em 3ch; cursor: auto; user-select: text; -webkit-user-select: text; }
    .nc .nc-meta { color: var(--prompt); white-space: pre-wrap; word-break: break-word; }
    .nc .nc-msg { color: var(--fg); white-space: pre-wrap; word-break: break-word; margin-top: .5em; }
    #humanWidget { min-height: 70px; display: flex; justify-content: center; align-items: center; background: var(--bg); padding: .4em; margin-bottom: .5em; }
    @media (max-width: 600px) {
      :root { --fs-base: 13.5px; --pad: 7px; --nc-fs: 16px; }
      .term-window { border-radius: 8px; }
      .titlebar { padding: 8px 12px; gap: 8px; }
      .title-icon { width: 40px; height: 40px; }
      .title { font-size: .85em; }
      #terminal { padding: 12px 12px 14px; }
      .modal-overlay { padding: 4px; }
      /* phones: the command on its own line, the description below it, indented */
      .line.help-row { flex-direction: column; gap: 0; margin-bottom: .35em; }
      .help-cmd { width: auto; }
      .help-desc { padding-left: 2ch; }
      .help-dash { display: none; }
      .nc.big { height: 100%; }
      .nc textarea { min-height: 6em; }
      .nc button { min-height: 44px; padding: .4em 1.2ch; }
      .nc .actions { gap: 2ch; }
      .nc select, .nc input[type="text"], .nc input[type="password"] { min-height: 44px; }
      .nc .nc-head { min-height: 44px; }
      .nc .check { min-height: 44px; align-items: center; }
    }
    @media (min-width: 1200px) { :root { --fs-base: 16px; } }
  </style>
</head>
<body>
  <div class="term-window">
    <div class="titlebar">
      <svg class="title-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M32,22V3H7V5H0V26H12V22h6v3H14v1H25V25H21V22H32ZM7,18H3V16H7v2Zm0-5H1V10H7v3ZM7,6V9H1V6H7Zm4,19H1V14H7v1H2v4H7v3h4v3ZM8,21V4H31V21H8Zm12,4H19V22h1v3Z"/>
        <circle cx="3" cy="22" r="1"/>
        <path d="M30,5H9V20H30V5ZM29,19H10V6H29V19Z"/>
      </svg>
      <div class="title" id="windowTitle">guest@zedon.tech — bash</div>
    </div>
    <div id="terminal" aria-live="polite">
      <div class="input-row" id="inputRow">
        <span class="prompt" id="promptLabel">guest@zedon.tech:~$</span>
        <input type="text" id="cmd" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" autofocus />
      </div>
    </div>

    <div class="modal-overlay" id="decodeModal">
      <div class="nc big" data-title="Decode PGP message" data-cols="104">
        <div id="decodeKeyInfo" class="nc-info"></div>
        <div id="decodeKeyWrap">
          <label for="decodeKey">Key to decrypt with</label>
          <select id="decodeKey"></select>
        </div>
        <label for="decodeCipher">Armored ciphertext (-----BEGIN PGP MESSAGE----- ...)</label>
        <textarea id="decodeCipher" placeholder="Paste encrypted message here..."></textarea>
        <div id="decodePassWrap">
          <label id="decodePassLabel" for="decodePass">Passphrase (optional: leave empty to use login password)</label>
          <input type="password" id="decodePass" placeholder="Leave empty to use session password" />
        </div>
        <div class="result" id="decodeResult"></div>
        <div class="actions">
          <button type="button" class="secondary" id="decodeCancel">Cancel</button>
          <button type="button" id="decodeRun">Decrypt</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="importModal">
      <div class="nc big" data-title="Import PGP private key" data-cols="104">
        <div id="importInfo" class="nc-info"></div>
        <label for="importKey">Armored private key (-----BEGIN PGP PRIVATE KEY BLOCK----- ...)</label>
        <textarea id="importKey" placeholder="Paste your private key here..."></textarea>
        <div id="importPreview" class="nc-note"></div>
        <label for="importPass">Passphrase of THIS key (may differ from your login password; empty if the key is not protected)</label>
        <input type="password" id="importPass" placeholder="Key passphrase" />
        <label class="check" id="importPublishRow"><input type="checkbox" id="importPublish" checked /> Use as my registered key (publish its public part)</label>
        <div class="result" id="importResult"></div>
        <div class="actions">
          <button type="button" class="secondary" id="importCancel">Cancel</button>
          <button type="button" id="importRun">Import</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="messageModal">
      <div class="nc big" data-title="Send message" data-cols="104">
        <div id="messageInfo" class="nc-info"></div>
        <label for="messageTo">To</label>
        <select id="messageTo"></select>
        <div id="messagePgp" class="nc-note"></div>
        <label for="messageSubject">Subject (sent in clear text, it becomes the email subject)</label>
        <input type="text" id="messageSubject" maxlength="120" autocomplete="off" enterkeyhint="next" />
        <label for="messageBody">Message</label>
        <textarea id="messageBody" placeholder="Write your message..."></textarea>
        <div class="result" id="messageResult"></div>
        <div class="actions">
          <button type="button" class="secondary" id="messageCancel">Cancel</button>
          <button type="button" id="messageSend">Send</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="historyModal">
      <div class="nc big" data-title="Message history" data-cols="104">
        <div id="historyInfo" class="nc-info"></div>
        <div id="historyList" class="nc-list" tabindex="0" role="listbox" aria-label="Message history"></div>
        <div id="historyHint" class="nc-hint"><span class="hint-kb">Up/Down: select   Enter: open/close   Esc: close   (or tap)</span><span class="hint-touch">Tap a message to open or close it</span></div>
        <div class="actions">
          <button type="button" class="secondary" id="historyClose">Close</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="humanModal">
      <div class="nc" data-title="Human check" data-cols="56">
        <div id="humanStatus" class="nc-info"></div>
        <div id="humanWidget"></div>
        <div class="actions">
          <button type="button" class="secondary" id="humanCancel">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script>
  (async function () {
    const DOMAIN = "zedon.tech";
    const WORKER_URL = "https://wispy-sky-14c4.the-original-vij.workers.dev/send";
    const STORAGE_KEY = "zedon_terminal_v1";
    const INSTALL_KEY = "zedon_install_v1";
    const TURNSTILE_SITE_KEY = "0x4AAAAAAFKP8YyP93rHLcry"; // public; the secret lives in the Worker
    const TOKEN_KEY = "zedon_token_v1";
    // Username registry lives on the same Worker (…/users/check, …/users/register)
    const API_BASE = WORKER_URL.replace(/\/send\/?$/, "");
    async function registryCall(path, body) {
      const res = await fetch(API_BASE + path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      let data = {};
      try { data = await res.json(); } catch (e) {}
      return { ok: res.ok, status: res.status, data: data || {} };
    }

    // ───── keccak256 begin (Ethereum Keccak-256, 0x01 padding; NOT NIST SHA3-256) ─────
    const KECCAK_RC = [
      "0000000000000001", "0000000000008082", "800000000000808a", "8000000080008000",
      "000000000000808b", "0000000080000001", "8000000080008081", "8000000000008009",
      "000000000000008a", "0000000000000088", "0000000080008009", "000000008000000a",
      "000000008000808b", "800000000000008b", "8000000000008089", "8000000000008003",
      "8000000000008002", "8000000000000080", "000000000000800a", "800000008000000a",
      "8000000080008081", "8000000000008080", "0000000080000001", "8000000080008008"
    ].map(function (x) { return [parseInt(x.slice(0, 8), 16) >>> 0, parseInt(x.slice(8), 16) >>> 0]; });
    const KECCAK_ROTC = [1, 3, 6, 10, 15, 21, 28, 36, 45, 55, 2, 14, 27, 41, 56, 8, 25, 43, 62, 18, 39, 61, 20, 44];
    const KECCAK_PILN = [10, 7, 11, 17, 18, 3, 5, 16, 8, 21, 24, 4, 15, 23, 19, 13, 12, 2, 20, 14, 22, 9, 6, 1];
    function rotl64(hi, lo, n) {
      if (n === 32) return [lo, hi];
      if (n < 32) return [((hi << n) | (lo >>> (32 - n))) >>> 0, ((lo << n) | (hi >>> (32 - n))) >>> 0];
      const m = n - 32;
      return [((lo << m) | (hi >>> (32 - m))) >>> 0, ((hi << m) | (lo >>> (32 - m))) >>> 0];
    }
    function keccakF(hi, lo) {
      const bcH = new Uint32Array(5), bcL = new Uint32Array(5);
      for (let round = 0; round < 24; round++) {
        for (let i = 0; i < 5; i++) {
          bcH[i] = hi[i] ^ hi[i + 5] ^ hi[i + 10] ^ hi[i + 15] ^ hi[i + 20];
          bcL[i] = lo[i] ^ lo[i + 5] ^ lo[i + 10] ^ lo[i + 15] ^ lo[i + 20];
        }
        for (let i = 0; i < 5; i++) {
          const r = rotl64(bcH[(i + 1) % 5], bcL[(i + 1) % 5], 1);
          const tH = bcH[(i + 4) % 5] ^ r[0], tL = bcL[(i + 4) % 5] ^ r[1];
          for (let j = 0; j < 25; j += 5) { hi[j + i] ^= tH; lo[j + i] ^= tL; }
        }
        let tH = hi[1], tL = lo[1];
        for (let i = 0; i < 24; i++) {
          const j = KECCAK_PILN[i], h0 = hi[j], l0 = lo[j];
          const r = rotl64(tH, tL, KECCAK_ROTC[i]);
          hi[j] = r[0]; lo[j] = r[1];
          tH = h0; tL = l0;
        }
        for (let j = 0; j < 25; j += 5) {
          for (let i = 0; i < 5; i++) { bcH[i] = hi[j + i]; bcL[i] = lo[j + i]; }
          for (let i = 0; i < 5; i++) {
            hi[j + i] ^= ~bcH[(i + 1) % 5] & bcH[(i + 2) % 5];
            lo[j + i] ^= ~bcL[(i + 1) % 5] & bcL[(i + 2) % 5];
          }
        }
        hi[0] ^= KECCAK_RC[round][0];
        lo[0] ^= KECCAK_RC[round][1];
      }
    }
    function le32hex(x) {
      let s = "";
      for (let k = 0; k < 4; k++) s += ((x >>> (8 * k)) & 0xff).toString(16).padStart(2, "0");
      return s;
    }
    /** Keccak-256 of a UTF-8 string → 64 lowercase hex chars. */
    function keccak256Hex(str) {
      const msg = new TextEncoder().encode(str);
      const rate = 136;
      const data = new Uint8Array(msg.length + (rate - (msg.length % rate)));
      data.set(msg);
      data[msg.length] ^= 0x01;
      data[data.length - 1] ^= 0x80;
      const hi = new Uint32Array(25), lo = new Uint32Array(25);
      for (let off = 0; off < data.length; off += rate) {
        for (let i = 0; i < rate / 8; i++) {
          const b = off + i * 8;
          lo[i] ^= data[b] | (data[b + 1] << 8) | (data[b + 2] << 16) | (data[b + 3] << 24);
          hi[i] ^= data[b + 4] | (data[b + 5] << 8) | (data[b + 6] << 16) | (data[b + 7] << 24);
        }
        keccakF(hi, lo);
      }
      let out = "";
      for (let i = 0; i < 4; i++) out += le32hex(lo[i]) + le32hex(hi[i]);
      return out;
    }
    // ───── keccak256 end ─────

    // ───── Human check: Cloudflare Turnstile → Worker session token ─────
    // The challenge is solved once; the Worker verifies it and returns a signed token
    // (valid ~7 days). Messages and registrations carry that token, and the Worker's
    // daily limits are counted per token, so people behind a shared IP (CGNAT) do not
    // use up each other's quota.
    function loadToken() {
      try {
        const t = JSON.parse(localStorage.getItem(TOKEN_KEY) || "null");
        if (t && t.token && t.exp * 1000 > Date.now() + 60000) return t.token;
      } catch (e) {}
      return null;
    }
    function clearToken() {
      try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    }
    function solveTurnstile() {
      return new Promise(function (resolve, reject) {
        const modal = document.getElementById("humanModal");
        const box = document.getElementById("humanWidget");

    const DOHStatus = { NoError: 0 };
    async function queryDNSRecords(hostname, recordType) {
      const r = await fetch(
        `https://1.1.1.1/dns-query?name=${encodeURIComponent(hostname)}&type=${recordType}`,
        { headers: { Accept: "application/dns-json" } }

      return response;

    async function deriveKey(password, salt) {
      const enc = new TextEncoder();
      const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: 120000, hash: "SHA-256" },
        base,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }
    async function encryptLocal(password, plaintext) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveKey(password, salt);
      const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(plaintext));
      return {
        salt: btoa(String.fromCharCode(...salt)),
        iv: btoa(String.fromCharCode(...iv)),
        data: btoa(String.fromCharCode(...new Uint8Array(ct)))
      };
    }
    async function decryptLocal(password, blob) {
      const salt = Uint8Array.from(atob(blob.salt), c => c.charCodeAt(0));
      const iv = Uint8Array.from(atob(blob.iv), c => c.charCodeAt(0));
      const data = Uint8Array.from(atob(blob.data), c => c.charCodeAt(0));
      const key = await deriveKey(password, salt);
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
      return new TextDecoder().decode(pt);
    }

    async function generatePGPKey(name, email, passphrase) {
      const { privateKey, publicKey } = await openpgp.generateKey({
        type: "ecc",
        curve: "curve25519",
        userIDs: [{ name, email: email || (name + "@zedon.tech") }],
        passphrase,
        format: "armored"

    async function encryptMessage(plaintext, publicKeyArmored) {
      const publicKey = await openpgp.readKey({ armoredKey: publicKeyArmored });

      if (!privateKey.isDecrypted()) {
        privateKey = await openpgp.decryptKey({ privateKey: privateKey, passphrase: passphrase });
      }
      const message = await openpgp.readMessage({ armoredMessage: ciphertext });
      const { data } = await openpgp.decrypt({ message, decryptionKeys: privateKey, format: "utf8" });

    function normalizeFp(fp) {

    function fingerprintsMatch(expected, actual) {

      // allow full fingerprint or suffix (16+ hex chars)
      if (a.length >= 16 && b.length >= 16) {
        return b.endsWith(a) || a.endsWith(b) || a === b;

      return a === b;

    const fpCache = new Map();

      if (!armored || !/BEGIN PGP/.test(armored)) return null;
      if (fpCache.has(armored)) return fpCache.get(armored);
      const fp = await fingerprintOfArmored(armored);
      if (fp) fpCache.set(armored, fp);

    /** Resolve remote user PGP: fetch URL if needed, verify against DNS fingerprint */
    async function resolveRecipientPublicKey(target, log) {
      log = log || print;
      if (!target) return null;
      // LOCAL session key already armored
      if (target.source === "LOCAL" && target.pgp && /BEGIN PGP/.test(target.pgp)) {
        return target.pgp;
      }
      let armored = null;
      const ref = target.pgp || target.pgpUrl || null;
      const expectedFp = target.pgpFp || null;

      if (ref && /^https?:\/\//i.test(ref)) {
        log("Fetching PGP key: " + ref, "sys");
        const res = await fetch(ref, { credentials: "omit" });
        if (!res.ok) throw new Error("Key fetch failed HTTP " + res.status);
        armored = (await res.text()).trim();
        if (!/BEGIN PGP PUBLIC KEY BLOCK/.test(armored)) {
          throw new Error("Fetched file is not an armored public key");
        }
      } else if (ref && /BEGIN PGP PUBLIC KEY BLOCK/.test(ref)) {
        armored = ref;
      } else if (!ref && expectedFp) {
        throw new Error("Only fingerprint in DNS — provide PGP=<https://...url.asc>");
      } else {
        return null;
      }

      const actualFp = await fingerprintOfArmored(armored);
      if (!actualFp) throw new Error("Could not read fingerprint from key");

      if (expectedFp) {
        if (!fingerprintsMatch(expectedFp, actualFp)) {
          throw new Error(
            "Fingerprint mismatch! DNS=" + normalizeFp(expectedFp).slice(-16) +
            " key=" + actualFp.slice(-16)
          );
        }
        log("PGP fingerprint OK: " + actualFp.slice(-16), "info");
      } else {
        log("PGP fingerprint (no DNS fp to check): " + actualFp.slice(-16), "warn");
      }
      return armored;
    }

    function appendBeforePrompt(node) {

      term.scrollTop = term.scrollHeight;
    }
    function print(text, cls) {
      const div = document.createElement("div");
      div.className = "line " + (cls || "out");
      div.textContent = text;
      appendBeforePrompt(div);
    }
    /** One logical paragraph / bullet: it wraps to any width, continuation lines keep the bullet's indent. */
    function printPara(text, cls) {
      const div = document.createElement("div");
      div.className = "line " + (cls || "out");
      div.textContent = text;
      const m = /^(\s*(?:[-*]|\d+\.)?\s*)/.exec(text);
      const n = m ? m[1].length : 0;
      if (n > 0) { div.style.paddingLeft = n + "ch"; div.style.textIndent = "-" + n + "ch"; }
      appendBeforePrompt(div);
    }
    /** A command (gold) with its description; on phones the description goes below it. */
    function printHelpRow(cmd, desc, dash, cls) {
      const div = document.createElement("div");
      div.className = "line " + (cls || "out") + " help-row";
      const c = document.createElement("span");
      c.className = "help-cmd";
      c.textContent = cmd;
      const d = document.createElement("span");
      d.className = "help-desc";
      if (dash !== false) {
        const x = document.createElement("span");
        x.className = "help-dash";
        x.textContent = "– ";
        d.appendChild(x);
      }
      d.appendChild(document.createTextNode(desc));
      div.appendChild(c);
      div.appendChild(document.createTextNode(" "));
      div.appendChild(d);
      appendBeforePrompt(div);
    }
    function printHtml(html, cls) {
      const div = document.createElement("div");
      div.className = "line " + (cls || "out");
      div.innerHTML = html;
      appendBeforePrompt(div);
    }
    function printPromptLine(cmd) {
      const div = document.createElement("div");
      div.className = "line cmd";
      div.innerHTML = '<span class="prompt">' + escapeHtml(promptText()) + '</span> ' + escapeHtml(cmd);
      appendBeforePrompt(div);
    }
    function escapeHtml(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }
    function promptText() { return currentUser + "@" + DOMAIN + ":~$"; }
    function refreshPrompt() {
      promptLabel.textContent = promptText();
      windowTitle.textContent = currentUser + "@" + DOMAIN + " — bash";
    }
    function clearScreen() {
      Array.from(term.children).forEach(function (el) {
        if (el !== inputRow) el.remove();
      });
    }

    function parseUserRecord(txt) {
      if (typeof txt !== "string" || txt.indexOf("usr=") === -1) return null;
      // Value runs until the next known label= (so "role=organization owner" keeps both words)
      const LABELS = "usr|role|PGP|pgp|fp|fingerprint|pgpfp|PGPFP";
      function get(key) {
        const re = new RegExp(
          "(?:^|\\s)" + key + "=(.+?)(?=\\s+(?:" + LABELS + ")=|$)",
          "i"
        );
        const m = txt.match(re);
        return m ? m[1].trim() : null;
      }
      const usr = get("usr");
      if (!usr) return null;
      // PGP= may be URL or (rarely) inline; fp= / fingerprint= / pgpfp= is the DNS fingerprint
      const pgpRaw = get("PGP") || get("pgp") || null;
      const pgpFp = get("fp") || get("fingerprint") || get("pgpfp") || get("PGPFP") || null;
      let pgpUrl = null;
      let pgpInline = null;
      if (pgpRaw) {
        if (/^https?:\/\//i.test(pgpRaw)) pgpUrl = pgpRaw;
        else if (/BEGIN/.test(pgpRaw)) pgpInline = pgpRaw;
        else if (!pgpFp && /^[0-9a-fA-F]{16,40}$/.test(pgpRaw.replace(/\s/g, ""))) {
          return {
            name: usr,
            role: get("role") || "user",
            pgp: null,
            pgpUrl: null,
            pgpFp: pgpRaw,
            source: "REMOTE"
          };
        } else {
          pgpUrl = pgpRaw;
        }
      }
      return {
        name: usr,
        role: get("role") || "user",
        pgp: pgpInline || pgpUrl,
        pgpUrl: pgpUrl,
        pgpFp: pgpFp,
        source: "REMOTE"
      };
    }

    async function loadRemoteUsers() {
      print("DNS TXT query: " + DOMAIN + " ...", "sys");
      try {
        const txts = await queryTXT(DOMAIN);
        remoteUsers = [];
        for (const t of txts) {
          const u = parseUserRecord(t);
          if (u) remoteUsers.push(u);
          String(t).split(/[|;]/).forEach(function (part) {
            const u2 = parseUserRecord(part.trim());
            if (u2 && !remoteUsers.find(function (x) { return x.name === u2.name; })) remoteUsers.push(u2);
          });
        }
        for (const u of remoteUsers) {
          try { if (u.pgp && /BEGIN PGP/.test(u.pgp)) await primeFingerprint(u.pgp); } catch (e) {}
        }
        print("  " + remoteUsers.length + " user record(s) found.", "sys");
      } catch (e) {
        print("DNS error: " + (e.message || e), "warn");
        remoteUsers = [];
      }
    }

    function findUser(name) {
      const n = name.toLowerCase();
      if (session && session.name.toLowerCase() === n) {
        return { name: session.name, role: "local", pgp: session.publicKey, source: "LOCAL" };
      }
      const localName = listLocalUserNames().find(function (x) { return x.toLowerCase() === n; });
      if (localName) return { name: localName, role: "local", pgp: null, source: "LOCAL" };
      return remoteUsers.find(function (u) { return u.name.toLowerCase() === n; }) || null;
    }

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/i.test(email);
    }

    // ───────────── PWA install tracking ─────────────
    // State lives in localStorage (INSTALL_KEY) as { installed, ts, via }.
    // It is a best-effort flag, kept honest by three signals:
    //   • running in standalone/app mode        → installed = true
    //   • "appinstalled" event                  → installed = true
    //   • "beforeinstallprompt" fires in a tab  → browser says NOT installed → installed = false
    let deferredPrompt = null;

    function loadInstall() {
      try { return JSON.parse(localStorage.getItem(INSTALL_KEY) || "{}"); }
      catch (e) { return {}; }
    }
    function saveInstall(obj) {
      try { localStorage.setItem(INSTALL_KEY, JSON.stringify(obj)); } catch (e) {}
    }
    function markInstalled(via) {
      saveInstall({ installed: true, ts: Date.now(), via: via });
    }
    function markNotInstalled() {
      try { localStorage.removeItem(INSTALL_KEY); } catch (e) {}
    }
    function isStandalone() {
      return ["standalone", "fullscreen", "minimal-ui", "window-controls-overlay"].some(function (m) {
        return window.matchMedia("(display-mode: " + m + ")").matches;
      }) || navigator.standalone === true ||
        (document.referrer || "").indexOf("android-app://") === 0;
    }
    function isIOS() {
      return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    }
    function isAndroid() { return /android/i.test(navigator.userAgent); }
    function installState() {
      const st = loadInstall();
      return {
        running: isStandalone(),
        flagged: !!st.installed,
        ts: st.ts || null,
        via: st.via || null,
        promptable: !!deferredPrompt
      };
    }
    function fmtTs(ts) {
      return ts ? new Date(ts).toISOString().replace("T", " ").slice(0, 19) : "?";
    }

    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      deferredPrompt = e;
      // The browser only offers installation when the app is NOT installed → clear a stale flag.
      if (loadInstall().installed && !isStandalone()) markNotInstalled();
    });
    window.addEventListener("appinstalled", function () {
      deferredPrompt = null;
      markInstalled("appinstalled");
      print("App installed. ✓", "info");
    });
    try {
      window.matchMedia("(display-mode: standalone)").addEventListener("change", function (e) {
        if (e.matches) markInstalled("standalone");
      });
    } catch (e) {}
    if (isStandalone()) markInstalled("standalone");

    function printManualInstallHelp() {
      if (isIOS()) {
        print("iOS has no install API. Do it by hand:", "sys");
        print("  Share (□↑) → Add to Home Screen");
      } else {
        print("The browser did not offer an install prompt.", "warn");
        print("Use the browser menu → 'Install app' / 'Add to Home screen'.", "sys");
        print("(Not every browser can install web apps, and nothing is offered if it is already installed.)", "sys");
      }
    }

    async function runInstall() {
      if (!deferredPrompt) { printManualInstallHelp(); return; }
      const dp = deferredPrompt;
      deferredPrompt = null; // the event is single-use
      busy = true;
      input.disabled = true;
      try {
        print("Waiting for the browser's install dialog...", "sys");
        dp.prompt();
        const choice = await dp.userChoice;
        if (choice && choice.outcome === "accepted") {
          markInstalled("prompt");
          print("Install accepted. ✓", "info");
        } else {
          print("Install dismissed.", "warn");
          print("Run 'install' again later; the browser may offer it again after a reload.", "sys");
        }
      } catch (e) {
        print("Install error: " + (e.message || e), "err");
      } finally {
        busy = false;
        input.disabled = false;
        input.focus();
      }
    }

    async function runUninstall() {
      let swCount = 0, cacheCount = 0;
      try {
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function (r) { return r.unregister(); }));
          swCount = regs.length;
        }
      } catch (e) { print("Service worker cleanup failed: " + (e.message || e), "warn"); }
      try {
        if (window.caches && caches.keys) {
          const keys = await caches.keys();
          await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          cacheCount = keys.length;
        }
      } catch (e) { print("Cache cleanup failed: " + (e.message || e), "warn"); }
      markNotInstalled();
      print("Cleanup done: " + swCount + " service worker(s), " + cacheCount + " cache(s), install flag cleared.", "info");
      print("A web page cannot remove an installed app itself. Remove the icon by hand:", "sys");
      if (isIOS()) {
        print("  Long-press the icon on the Home Screen → Remove App → Delete App");
      } else if (isAndroid()) {
        print("  Long-press the app icon → Uninstall (or Remove)");
      } else {
        print("  In the app window: ⋮ menu → Uninstall zedon.tech…");
        print("  or open chrome://apps (edge://apps) → right-click the app → Remove");
      }
      if (isStandalone()) {
        print("You are inside the app right now; the flag is set again on next start until you remove it.", "warn");
      }
      print("Your local users and keys were not touched (use 'purge' for that).", "sys");
    }
    // ───────────── /PWA install tracking ─────────────

    const commands = {
      help: function (args) {
        const topic = ((args && args[0]) || "").toLowerCase();
        if (topic) {
          if (topic === "login") { explain("login"); print(""); explain("restore"); return; }
          if (EXPLAIN[topic]) { explain(topic); return; }
          print("No help topic '" + topic + "'. Topics: login, export, import", "err");
          return;
        }
        print("Available commands:", "sys");
        [
          ["help [command]", "this list; 'help login|export|import' explains how they work"],

          ["users", "users (DNS + local)"],
          ["about", "short info"],
          ["clear", "clear screen"],
          ["history", "your sent messages (panel: Up/Down select, Enter opens, Esc closes)"],
          ["register <name>", "claim a name: email (twice), the emailed code, then a password + PGP keygen"],
          ["login <name>", "login (password, then an emailed code when not verified)"],
          ["logout", "back to guest"],
          ["message", "write a message to us (panel; login required)"],
          ["decode", "decrypt PGP message (panel, pick key + passphrase)"],

        ].forEach(function (r) { printHelpRow(r[0], r[1]); });
      },
      whoami: function () {
        print(currentUser);
        print("  host : " + DOMAIN);
        print("  mode : " + (session ? "authenticated local" : "guest"));
        if (session) {
          print("  pgp  : " + fingerprintShort(session.publicKey));
          print("  mail : " + (session.email ? maskEmail(session.email) : "(none, not registered on the server)"));
          print("  auth : " + (hasUserToken() ? "verified until " + fmtTs(session.userTokenExp * 1000) : "not verified"));
          if ((session.keys || []).length) print("  keys : +" + session.keys.length + " more (imported / previous), see decode");
        }
        (function () {
          const st = installState();
          let app = "not installed";
          if (st.running) app = "installed (running as app)";
          else if (st.flagged) app = "installed (since " + fmtTs(st.ts) + ")";
          print("  app  : " + app);
        })();
      },
      users: function () {
        const seen = {};
        const blocks = [];
        listLocalUserNames().forEach(function (name) {
          seen[name.toLowerCase()] = true;
          const isMe = session && session.name === name;
          const pgp = isMe ? fingerprintShort(session.publicKey) : "(locked)";
          blocks.push(function () {
            print("user name: " + name);
            print("role: local");
            print("PGP fingerprint: " + pgp);
            print("LOCAL user");
          });
        });
        remoteUsers.forEach(function (u) {
          if (seen[u.name.toLowerCase()]) return;
          const fp = u.pgpFp
            ? normalizeFp(u.pgpFp).slice(-16)
            : (u.pgp && !/^https?:/i.test(u.pgp) ? fingerprintShort(u.pgp) : "(none)");
          const url = u.pgpUrl || (u.pgp && /^https?:/i.test(u.pgp) ? u.pgp : "");
          blocks.push(function () {
            print("user name: " + u.name);
            print("role: " + u.role);
            print("PGP fingerprint: " + fp);
            if (url) {
              printHtml(
                '<a class="term-link" href="' + escapeHtml(url) +
                '" target="_blank" rel="noopener noreferrer" download="' +
                escapeHtml(u.name) + '.asc">download ' + escapeHtml(u.name) +
                "'s public key</a>"
              );
            }
            print("REMOTE user");
          });
        });
        if (!blocks.length) {
          print("(no known users — register or add DNS TXT)", "sys");
          return;
        }
        blocks.forEach(function (render, i) {
          render();
          if (i < blocks.length - 1) {
            print(" "); // visible blank line between users
          }
        });
      },
      about: function () {
        print("Welcome to a not yet formed LLC's homepage!", "gold");
        print("Feel free to send a message to us! All sent messages are saved locally.", "gold");
      },
      clear: function () { clearScreen(); },
      history: function () { openHistoryPanel(); },
      register: async function (args) {
        if (session) { print("Already logged in. Use: logout", "err"); return; }
        const name = (args[0] || "").trim();
        if (!name || !/^[a-zA-Z0-9._-]{2,32}$/.test(name)) {
          print("Usage: register <name>   (2–32 chars, a-z 0-9 . _ -)", "err");
          return;
        }
        if (name.toLowerCase() === "guest") { print("'guest' is reserved.", "err"); return; }
        if (listLocalUserNames().some(function (x) { return x.toLowerCase() === name.toLowerCase(); })) {
          print("Name already exists locally. Use: login " + name, "err");
          return;
        }
        if (remoteUsers.some(function (u) { return u.name.toLowerCase() === name.toLowerCase(); })) {
          print("'" + name + "' is a reserved system user.", "err");
          return;
        }
        busy = true;
        input.disabled = true;
        print("Checking name in the registry...", "sys");
        let available = false;
        let ipHash = null;
        try {
          try {
            await getSessionToken(false);
          } catch (e) {
            print("Verification failed: " + (e.message || e), "err");
            return;
          }
          const r = await registryCall("/users/check", { name: name });
          if (!r.ok) {
            print("Registry error (" + r.status + ")" + (r.data.error ? ": " + r.data.error : "") + ".", "err");
          } else if (!r.data.available) {
            print("Name '" + name + "' is not available" + (r.data.reason ? " (" + r.data.reason + ")" : "") + ".", "err");
          } else if (!r.data.ip) {
            print("Could not determine your IP address for the registry hash.", "err");
          } else {
            ipHash = keccak256Hex(String(r.data.ip)); // computed here, the raw IP is never sent back
            available = true;
          }
        } catch (e) {
          print("Registry unreachable: " + (e.message || e), "err");
          print("Registration needs the registry. Try again later.", "warn");
        } finally {
          busy = false;
          input.disabled = false;
          input.focus();
        }
        if (!available) return;
        interactive = { step: "reg_email1", data: { name: name, ipHash: ipHash } };
        print("Register: " + name, "sys");
        print("Email address (a one-time code will be sent to it):");
        promptLabel.textContent = "email>";
        input.type = "text";
      },
      login: function (args) {
        if (session) { print("Already logged in (" + session.name + "). Use: logout", "err"); return; }
        const name = (args[0] || "").trim();
        if (!name) {
          print("Usage: login <name>", "err");
          explain("login");
          return;
        }
        if (!/^[a-zA-Z0-9._-]{2,32}$/.test(name)) { print("Invalid name.", "err"); return; }
        const local = listLocalUserNames().find(function (x) { return x.toLowerCase() === name.toLowerCase(); });
        if (local) {
          interactive = { step: "login_pass", data: { name: name } };
          print("Password: unlocks the keys stored in THIS browser (it is never sent anywhere).", "sys");
          print("If your session is not verified, an emailed code is asked next ('help login' explains).", "sys");
          print("Password:");
          promptLabel.textContent = "password>";
          input.type = "password";
          return;
        }
        if (remoteUsers.some(function (u) { return u.name.toLowerCase() === name.toLowerCase(); })) {
          print("'" + name + "' is a reserved system user.", "err");
          return;
        }
        print("There is no local profile named '" + name + "' in this browser.", "warn");
        explain("restore");
        interactive = { step: "restore_confirm", data: { name: name } };
        print("Try to restore '" + name + "' on this device? (type 'YES')", "warn");
        promptLabel.textContent = "confirm>";
      },
      logout: function () {
        if (!session) { print("Already guest.", "sys"); return; }
        print("Logout: " + session.name + " → guest", "sys");
        msgSaved = null;
        session = null;
        currentUser = "guest";
        refreshPrompt();
      },
      pubkey: function () {
        if (!session) { print("No logged-in user / key. Use: register <name>", "err"); return; }
        print(session.publicKey);
      },
      export: function (args) {
        if (!session) {
          print("No logged-in user. Use: login <name> or register <name>", "err");
          return;
        }
        const all = ((args && args[0]) || "").toLowerCase() === "all";
        explain("export");
        print("");
        downloadText(session.name + ".asc", session.publicKey);
        print("Downloaded: " + session.name + ".asc  (public key)", "info");
        downloadText(session.name + "-private.asc", session.privateKey);
        print("Downloaded: " + session.name + "-private.asc  (PRIVATE key: your backup, keep it secret)", "warn");
        const others = session.keys || [];
        if (all) {
          others.forEach(function (k) {
            const tag = String(k.fp || "").slice(-16) || "key";
            downloadText(session.name + "-" + tag + ".asc", k.publicKey);
            downloadText(session.name + "-" + tag + "-private.asc", k.privateKey);
            print("Downloaded: " + session.name + "-" + tag + ".asc and -private.asc  (" + (k.label || "other") + " key)", "warn");
          });
          if (!others.length) print("This account has no other keys.", "sys");
          else print("Your browser may ask to allow multiple downloads.", "sys");
        } else if (others.length) {
          print("This account has " + others.length + " other key(s) (imported / previous). 'export all' downloads them too.", "sys");
        }
      },
      install: function () {
        const st = installState();
        if (st.running) { print("Already running as an installed app.", "sys"); return; }
        if (st.flagged && !st.promptable) {
          print("Already installed on this device (since " + fmtTs(st.ts) + ").", "sys");
          print("Open it from your app launcher / home screen.", "sys");
          return;
        }
        interactive = { step: "install_confirm", data: {} };
        print("Install zedon.tech terminal as an app on this device. Are you sure? (type 'YES')", "warn");
        promptLabel.textContent = "confirm>";
      },
      uninstall: function () {
        const st = installState();
        if (!st.running && !st.flagged) {
          print("No install recorded on this device.", "sys");
          if (isIOS()) print("(iOS keeps a Home Screen app's data separate: run 'uninstall' inside the app.)", "sys");
          return;
        }
        interactive = { step: "uninstall_confirm", data: {} };
        print("This clears the app's caches, service workers and the install flag,", "warn");
        print("then shows how to remove the icon. Keys and users stay.", "warn");
        print("Uninstall? Are you sure? (type 'YES')", "warn");
        promptLabel.textContent = "confirm>";

      purge: function () {
        interactive = { step: "purge_confirm", data: {} };
        print("Holy GDPR! Are you sure? (type 'YES')", "warn");
        promptLabel.textContent = "confirm>";
      },
      exit: function () {
        if (busy) return;
        busy = true;
        input.disabled = true;
        print("Bye! Come back soon!", "info");
        var countLine = document.createElement("div");
        countLine.className = "line sys";
        countLine.textContent = "5";
        term.appendChild(countLine);
        term.scrollTop = term.scrollHeight;
        var n = 5;
        function tick() {
          n--;
          if (n > 0) {

      decode: function () { openDecodePanel(); },

    async function handleInteractive(line) {
      const t = line.trim();
      if (t.toLowerCase() === "cancel") {
        resetInteractive();
        print("Cancelled.", "warn");
        return;
      }
      const step = interactive.step;
      const d = interactive.data;

      if (step === "reg_email1") {
        if (!isValidEmail(t)) { print("Invalid email address.", "err"); return; }
        d.email1 = t;
        interactive.step = "reg_email2";
        print("Repeat the email address:");
        promptLabel.textContent = "email again>";
        return;
      }
      if (step === "reg_email2") {
        if (t.toLowerCase() !== d.email1.toLowerCase()) {
          print("The two addresses do not match. Enter the email address again:", "err");
          interactive.step = "reg_email1";
          promptLabel.textContent = "email>";
          return;
        }
        d.email = d.email1;
        if (!(await requestRegisterOtp(d))) {
          print("Registration aborted, nothing was saved.", "warn");
          resetInteractive();
          return;
        }
        interactive.step = "reg_otp";
        input.type = "text";
        print("Enter the 6-digit code ('resend' for a new one, 'cancel' to stop):");
        promptLabel.textContent = "code>";
        return;
      }
      if (step === "reg_otp") {
        if (t.toLowerCase() === "resend") {
          if (await requestRegisterOtp(d)) print("Enter the new code:");
          return;
        }
        if (!/^\d{6}$/.test(t)) { print("The code is 6 digits ('resend' for a new one).", "err"); return; }
        busy = true;
        input.disabled = true;
        let abort = false;
        try {
          const tok = await getSessionToken(false);
          const r = await registryCall("/register/confirm", { name: d.name, email: d.email, otp: t, token: tok });
          if (r.ok) {
            d.proof = r.data.proof;
            print("Email verified. ✓", "info");
            print("Now choose a password for this device (min 6 chars). It protects your PGP key and messages in this browser:");
            interactive.step = "reg_pass";
            promptLabel.textContent = "password>";
            input.type = "password";
          } else if (r.status === 400 && r.data.reason === "otp") {
            print("Wrong code" + (typeof r.data.attempts_left === "number" ? " (" + r.data.attempts_left + " attempt(s) left)" : "") + ". Try again or type 'resend'.", "err");
          } else if (r.status === 410) {
            print("The code expired or there were too many wrong attempts. Type 'resend' for a new code.", "err");
          } else if (r.status === 409) {
            print("Name '" + d.name + "' was just taken. Registration aborted.", "err");
            print("Nothing was saved locally.", "warn");
            abort = true;
          } else {
            if (r.status === 401) clearToken();
            print("Registry error (" + r.status + ")" + (r.data.error ? ": " + r.data.error : "") + ". Try again.", "err");
          }
        } catch (e) {
          print("Verification failed: " + (e.message || e), "err");
        } finally {
          busy = false;
          input.disabled = false;
          input.focus();
        }
        if (abort) resetInteractive();
        return;
      }
      if (step === "reg_pass") {
        if (t.length < 6) { print("Password too short (min 6).", "err"); return; }
        d.password = t;
        interactive.step = "reg_pass2";
        print("Confirm password:");
        promptLabel.textContent = "confirm>";
        return;
      }
      if (step === "reg_pass2") {
        if (t !== d.password) {
          print("The passwords do not match. Choose the password again:", "err");
          interactive.step = "reg_pass";
          promptLabel.textContent = "password>";
          return;
        }
        print("Generating PGP keypair (curve25519)...", "sys");
        busy = true;
        try {
          d.keys = await generatePGPKey(d.name, d.name + "@" + DOMAIN, d.password);
          d.fp = await primeFingerprint(d.keys.publicKey);
          if (!d.fp) throw new Error("could not compute the key fingerprint");
        } catch (e) {
          print("Keygen error: " + (e.message || e), "err");
          busy = false;
          resetInteractive();
          return;
        }
        busy = false;
        input.type = "text";
        print("Key fingerprint: " + fingerprintShort(d.keys.publicKey), "sys");

        return;
      }
      if (step === "reg_retry") {

      if (step === "restore_confirm") {

        await beginRestore(d.name);
        return;
      }
      if (step === "restore_otp") {
        if (t.toLowerCase() === "resend") {
          if (await requestLoginOtp(d.name, "the email address registered for this account")) print("Enter the new code:");
          return;
        }
        if (!/^\d{6}$/.test(t)) { print("The code is 6 digits ('resend' for a new one).", "err"); return; }
        busy = true;
        input.disabled = true;
        try {
          const tok = await getSessionToken(false);
          const r = await registryCall("/login/verify", { name: d.name, otp: t, token: tok });
          if (r.ok) {
            d.name = r.data.name || d.name;
            d.userToken = r.data.user_token;
            d.exp = r.data.exp;
            d.email = r.data.email;
            d.fp = normalizeFp(r.data.fingerprint);

            print("Choose a NEW password for this device (min 6 chars). It only protects the keys stored in this browser:");
            interactive.step = "restore_pass";
            promptLabel.textContent = "password>";
            input.type = "password";
          } else if (r.status === 400 && r.data.reason === "otp") {
            print("Wrong code" + (typeof r.data.attempts_left === "number" ? " (" + r.data.attempts_left + " attempt(s) left)" : "") + ". Try again or type 'resend'.", "err");
          } else if (r.status === 410) {
            print("The code expired or there were too many wrong attempts. Type 'resend' for a new code.", "err");
          } else {

      if (step === "restore_pass") {

        const c = t.toLowerCase();

        if (c === "newkey") {

        print("Generating PGP keypair (curve25519)...", "sys");

        try {

          if (!fp) throw new Error("could not compute the key fingerprint");
          const r = await registryCall("/keys/update", { public_key: keys.publicKey, fingerprint: fp, user_token: d.userToken });
          if (!r.ok) {
            print("The registry refused the new key (" + r.status + ")" + (r.data.error ? ": " + r.data.error : "") + ".", "err");
            keys = null;

      }
      if (step === "login_pass") {
        let needOtp = false;
        try {
          session = await loadUser(d.name, t);
          await primeFingerprint(session.publicKey);
          for (const k of session.keys) await primeFingerprint(k.publicKey);
          currentUser = session.name;
          refreshPrompt();
          print("Welcome, " + session.name, "info");
          if (!session.email) {

      if (step === "login_otp") {
        if (t.toLowerCase() === "resend") { await startLoginOtp(); return; }
        if (!/^\d{6}$/.test(t)) { print("The code is 6 digits ('resend' for a new one).", "err"); return; }
        busy = true;
        input.disabled = true;
        let done = false;
        try {
          const tok = await getSessionToken(false);
          const r = await registryCall("/login/verify", { name: session.name, otp: t, token: tok });
          if (r.ok) {
            session.userToken = r.data.user_token;
            session.userTokenExp = r.data.exp;
            await saveSession();
            print("Verified. ✓  You can send messages now.", "info");
            done = true;
          } else if (r.status === 400 && r.data.reason === "otp") {
            print("Wrong code" + (typeof r.data.attempts_left === "number" ? " (" + r.data.attempts_left + " attempt(s) left)" : "") + ". Try again or type 'resend'.", "err");
          } else if (r.status === 410) {
            print("The code expired or there were too many wrong attempts. Type 'resend' for a new code.", "err");
          } else {
            if (r.status === 401) clearToken();
            print("Registry error (" + r.status + ")" + (r.data.error ? ": " + r.data.error : "") + ". Try again.", "err");
          }
        } catch (e) {
          print("Verification failed: " + (e.message || e), "err");
        } finally {
          busy = false;
          input.disabled = false;
          input.focus();
        }
        if (done) resetInteractive();
        return;
      }
      if (step === "install_confirm") {
        interactive = null;
        refreshPrompt();
        if (t === "YES") {
          await runInstall();
        } else {
          print("Install aborted. (You must type YES in capitals.)", "warn");

      if (step === "uninstall_confirm") {

          print("Uninstall aborted. (You must type YES in capitals.)", "warn");

      if (step === "purge_confirm") {

          session = null;

        }

    }

    function downloadText(filename, text) {
      const blob = new Blob([text], { type: "application/pgp-keys; charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        URL.revokeObjectURL(url);
        a.remove();
      }, 500);
    }

    // Keys available for decryption: the registered (active) key first, then imported / previous ones.

      const list = [];

      if (session.privateKey) {
        list.push({ label: "registered", publicKey: session.publicKey, privateKey: session.privateKey, loginPass: session.activeLoginPass !== false });
      }
      (session.keys || []).forEach(function (k) {
        list.push({ label: k.label || "imported", publicKey: k.publicKey, privateKey: k.privateKey, loginPass: !!k.loginPass });
      });
      return list;
    }

        : "Active key: " + fingerprintShort(session.publicKey) + "  ·  the imported key keeps its OWN passphrase; you enter it in decode. It is never uploaded.";
      document.getElementById("importModal").classList.add("open");

    // Shows which User IDs (name / email) the pasted key contains, and that publishing makes them public.
    let previewSeq = 0;
    let previewTimer = null;
    async function updateImportPreview() {
      const seq = ++previewSeq;
      const box = document.getElementById("importPreview");
      const armored = document.getElementById("importKey").value.trim();
      const publish = document.getElementById("importPublish").checked && !restoreCtx;
      function show(lines) {
        if (seq !== previewSeq) return;
        box.textContent = "";
        lines.forEach(function (l) {
          const d = document.createElement("div");
          d.textContent = l.t;          // textContent: User IDs are untrusted text
          if (l.alert) d.className = "nc-alert";
          box.appendChild(d);
        });
      }
      if (!armored) { show([]); return; }
      let key;
      try {
        key = await openpgp.readPrivateKey({ armoredKey: armored });
      } catch (e) {
        show([{ t: "This does not look like a valid PGP private key." }]);
        return;
      }
      const uids = key.getUserIDs();
      const lines = [{ t: "Key " + key.getFingerprint().toUpperCase().slice(-16) + ". User IDs inside this key:" }];
      if (uids.length) uids.slice(0, 8).forEach(function (u) { lines.push({ t: "  * " + u }); });
      else lines.push({ t: "  (none)" });
      if (uids.length > 8) lines.push({ t: "  ... and " + (uids.length - 8) + " more" });
      if (publish) {
        lines.push({ t: "!! These User IDs become PUBLIC: the public key, with them, is stored on the server.", alert: true });
      } else if (!restoreCtx) {
        lines.push({ t: "Not published: the key stays in this browser only." });
      }
      show(lines);
    }
    function schedulePreview() {
      clearTimeout(previewTimer);
      previewTimer = setTimeout(updateImportPreview, 150);
    }
    document.getElementById("importKey").addEventListener("input", schedulePreview);
    document.getElementById("importPublish").addEventListener("change", updateImportPreview);

    function closeImportPanel() {
      document.getElementById("importModal").classList.remove("open");
      input.focus();
    }
    document.getElementById("importCancel").onclick = closeImportPanel;
    document.getElementById("importRun").onclick = async function () {
      const resEl = document.getElementById("importResult");
      const say = function (m) { resEl.textContent = m; resEl.classList.add("show"); };
      const btn = document.getElementById("importRun");
      const armored = document.getElementById("importKey").value.trim();
      const pass = document.getElementById("importPass").value;
      const publish = document.getElementById("importPublish").checked;
      if (!/BEGIN PGP PRIVATE KEY BLOCK/.test(armored)) { say("This is not an armored PGP private key."); return; }
      const rc = restoreCtx;
      if (rc) {
        // New-device restore: the key must be the one the account was registered with.
        btn.disabled = true;
        try {
          const key = await openpgp.readPrivateKey({ armoredKey: armored });
          if (!key.isDecrypted()) {
            try { await openpgp.decryptKey({ privateKey: key, passphrase: pass }); }
            catch (e) { say("Wrong passphrase for this key."); return; }
          }
          const fp = key.getFingerprint().toUpperCase();
          if (fp !== rc.fp) {
            say("This key does not match the account: registered ..." + rc.fp.slice(-16) + ", this one ..." + fp.slice(-16) +
                ". Use the key file exported from '" + rc.name + "'.");
            return;
          }
          const publicKey = key.toPublic().armor();
          fpCache.set(publicKey, fp);
          closeImportPanel();
          await finishRestore(rc, publicKey, armored, pass !== "" && pass === rc.password);
        } catch (e) {
          say("Import failed: " + (e.message || e));
        } finally {
          btn.disabled = false;
        }
        return;
      }
      if (!session) { say("Login required."); return; }
      if (publish && !hasUserToken()) { say("Publishing needs a verified session. Log in again (emailed code) or untick the option."); return; }
      btn.disabled = true;
      try {
        const key = await openpgp.readPrivateKey({ armoredKey: armored });
        if (!key.isDecrypted()) {
          try { await openpgp.decryptKey({ privateKey: key, passphrase: pass }); }
          catch (e) { say("Wrong passphrase for this key."); return; }
        }
        const fp = key.getFingerprint().toUpperCase();
        const activeFp = await primeFingerprint(session.publicKey);
        if (fp === activeFp || (session.keys || []).some(function (k) { return k.fp === fp; })) {
          say("This key is already in your account.");
          return;
        }
        const publicKey = key.toPublic().armor();
        if (publish) {
          const r = await registryCall("/keys/update", { public_key: publicKey, fingerprint: fp, user_token: session.userToken });
          if (!r.ok) {
            if (r.status === 401) { session.userToken = null; session.userTokenExp = 0; await saveSession(); }
            say("The registry refused the key (" + r.status + ")" + (r.data.error ? ": " + r.data.error : "") + ".");
            return;
          }
          // the previously registered key stays available for decrypting old messages
          session.keys = session.keys || [];
          session.keys.push({ fp: activeFp, label: "previous", publicKey: session.publicKey, privateKey: session.privateKey, loginPass: session.activeLoginPass !== false, added: Date.now() });
          session.publicKey = publicKey;
          session.privateKey = armored;
          session.activeLoginPass = false;
        } else {
          session.keys = session.keys || [];
          session.keys.push({ fp: fp, label: "imported", publicKey: publicKey, privateKey: armored, loginPass: false, added: Date.now() });
        }
        fpCache.set(publicKey, fp);
        await saveSession();
        print("Key imported: " + fp.slice(-16) + (publish ? "  (now your registered key, public part saved on the server)" : ""), "info");
        print("Its passphrase is not stored: enter it in decode.", "sys");
        closeImportPanel();
      } catch (e) {
        say("Import failed: " + (e.message || e));
      } finally {
        btn.disabled = false;
      }
    };

    // ───── Message panel: recipient, subject, body ─────

    function messageRecipients() {
      const out = [];
      remoteUsers.forEach(function (u) {
        if (!out.some(function (r) { return r.name.toLowerCase() === u.name.toLowerCase(); })) out.push({ name: u.name, role: u.role });

    function openMessagePanel(pre) {
      if (!session) { print("Guests cannot send messages. Use: register <name> or login <name>", "err"); return; }
      if (!session.email) { print("This local account is not registered on the server. Use purge, then register.", "err"); return; }
      if (!hasUserToken()) { print("Your session is not verified. Log in again (an emailed code is needed).", "err"); return; }
      const sel = document.getElementById("messageTo");

      const area = document.getElementById("messageBody");
      const res = document.getElementById("messageResult");
      sel.textContent = "";
      const rec = messageRecipients();
      rec.forEach(function (r) {
        const o = document.createElement("option");
