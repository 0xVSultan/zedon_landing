<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#4caf50" />
  <meta name="description" content="zedon.tech terminal" />
  <title>zedon.tech — terminal</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="android-chrome-512x512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <script src="https://unpkg.com/openpgp@5.11.2/dist/openpgp.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #33ff66;
      --dim: #1a3a22;
      --accent: #00cc55;
      --error: #ff5555;
      --warn: #ffaa00;
      --prompt: #66ff99;
      --cursor: #33ff66;
      --panel: #111;
      --border: #1f3a28;
      --font: "SF Mono", "Fira Code", "Cascadia Code", "JetBrains Mono", "Consolas", "Liberation Mono", Menlo, Monaco, monospace;
      --fs-base: clamp(13px, 1.55vw, 16.5px);
      --line-h: 1.45;
      --pad: clamp(10px, 2.2vw, 26px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      font-size: var(--fs-base);
      line-height: var(--line-h);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    body { display: flex; flex-direction: column; padding: var(--pad); }
    .term-window {
      flex: 1; display: flex; flex-direction: column;
      border: 1px solid var(--dim); border-radius: 10px; overflow: hidden;
      background: #050505;
      box-shadow: 0 0 0 1px rgba(51,255,102,.06), 0 20px 60px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.03);
      max-width: 1100px; width: 100%; margin: 0 auto; min-height: 0; position: relative;
    }
    .titlebar {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      background: linear-gradient(180deg,#141414,#0d0d0d); border-bottom: 1px solid var(--dim);
      user-select: none; flex-shrink: 0;
    }
    .title-icon {
      width: 48px; height: 48px; flex-shrink: 0;
      fill: var(--accent); opacity: 0.95;
    }
    .title {
      flex: 1; text-align: center; font-size: .9em; color: #aaa;
      letter-spacing: .03em; font-weight: 500;
    }
    #terminal {
      flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px 18px 18px;
      scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
    }
    #terminal::-webkit-scrollbar { width: 8px; }
    #terminal::-webkit-scrollbar-track { background: transparent; }
    #terminal::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 4px; }
    .line { white-space: pre-wrap; word-break: break-word; margin-bottom: 2px; }
    .line.cmd { color: var(--fg); }
    .line.out { color: #b8f0c8; }
    .line.err { color: var(--error); }
    .line.warn { color: var(--warn); }
    .line.sys { color: #6a9; }
    .line.info { color: #8cf; }
    .line a.term-link {
      color: #6cf; text-decoration: underline; word-break: break-all;
    }
    .line a.term-link:hover { color: #9df; }
    .prompt { color: var(--prompt); font-weight: 500; }
    .input-row {
      display: flex; align-items: baseline; gap: 0; margin-top: 2px;
    }
    .input-row .prompt { white-space: nowrap; margin-right: 6px; }
    #cmd {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--fg); font-family: inherit; font-size: inherit; line-height: inherit;
      caret-color: var(--cursor); min-width: 0; padding: 0;
    }
    .modal-overlay {
      display: none; position: absolute; inset: 0; background: rgba(0,0,0,.72);
      z-index: 50; align-items: center; justify-content: center; padding: 12px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      width: min(640px, 100%); height: min(88vh, 720px); max-height: 92%;
      display: flex; flex-direction: column;
      box-shadow: 0 24px 80px rgba(0,0,0,.8);
    }
    .modal header {
      padding: 14px 18px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      font-size: .95em; color: #9c9; flex-shrink: 0;
    }
    .modal .body { padding: 16px 18px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; }
    .modal label { display: block; font-size: .8em; color: #7a9; margin-bottom: 4px; }
    .modal textarea, .modal input[type="password"], .modal input[type="text"] {
      width: 100%; background: #0a0a0a; border: 1px solid var(--dim); color: var(--fg);
      font-family: inherit; font-size: .9em; padding: 8px 10px; border-radius: 6px;
      resize: vertical; margin-bottom: 12px;
    }
    .modal textarea { min-height: 220px; flex: 1; }
    .modal .actions { display: flex; gap: 8px; justify-content: flex-end; padding-top: 4px; flex-shrink: 0; }
    .modal .actions button {
      background: #132; border: 1px solid var(--accent); color: var(--fg);
      font-family: inherit; font-size: .85em; padding: 7px 14px; border-radius: 5px; cursor: pointer;
    }
    .modal .actions button.secondary { background: transparent; border-color: var(--dim); }
    .modal .result {
      margin-top: 10px; padding: 10px; background: #0c140e; border: 1px solid var(--dim);
      border-radius: 6px; white-space: pre-wrap; word-break: break-word; font-size: .88em;
      max-height: 240px; overflow-y: auto; display: none; flex-shrink: 0;
    }
    .modal .result.show { display: block; }
    @media (max-width: 600px) {
      :root { --fs-base: 13.5px; --pad: 7px; }
      .term-window { border-radius: 8px; }
      .titlebar { padding: 8px 12px; gap: 8px; }
      .title-icon { width: 40px; height: 40px; }
      .title { font-size: .85em; }
      #terminal { padding: 12px 12px 14px; }
      .modal { height: min(92vh, 100%); width: 100%; }
      .modal textarea { min-height: 160px; }
    }
    @media (min-width: 1200px) { :root { --fs-base: 16px; } }
  </style>
</head>
<body>
  <div class="term-window">
    <div class="titlebar">
      <svg class="title-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M32,22V3H7V5H0V26H12V22h6v3H14v1H25V25H21V22H32ZM7,18H3V16H7v2Zm0-5H1V10H7v3ZM7,6V9H1V6H7Zm4,19H1V14H7v1H2v4H7v3h4v3ZM8,21V4H31V21H8Zm12,4H19V22h1v3Z"/>
        <circle cx="3" cy="22" r="1"/>
        <path d="M30,5H9V20H30V5ZM29,19H10V6H29V19Z"/>
      </svg>
      <div class="title" id="windowTitle">guest@zedon.tech — bash</div>
    </div>
    <div id="terminal" aria-live="polite">
      <div class="input-row" id="inputRow">
        <span class="prompt" id="promptLabel">guest@zedon.tech:~$</span>
        <input type="text" id="cmd" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" autofocus />
      </div>
    </div>

    <div class="modal-overlay" id="decodeModal">
      <div class="modal">
        <header>
          <span>decode — PGP decrypt</span>
        </header>
        <div class="body">
          <div id="decodeKeyInfo" style="font-size:.82em;color:#7a9;margin-bottom:12px;padding:8px 10px;background:#0c140e;border:1px solid var(--dim);border-radius:6px;"></div>
          <label>Armored ciphertext (-----BEGIN PGP MESSAGE----- ...)</label>
          <textarea id="decodeCipher" placeholder="Paste encrypted message here..."></textarea>
          <div id="decodePassWrap">
            <label id="decodePassLabel">Passphrase (optional — leave empty to use login password)</label>
            <input type="password" id="decodePass" placeholder="Leave empty to use session password" />
          </div>
          <div class="actions">
            <button type="button" class="secondary" id="decodeCancel">Cancel</button>
            <button type="button" id="decodeRun">Decrypt</button>
          </div>
          <div class="result" id="decodeResult"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
  (async function () {
    const DOMAIN = "zedon.tech";
    const WORKER_URL = "https://wispy-sky-14c4.the-original-vij.workers.dev/send";
    const STORAGE_KEY = "zedon_terminal_v1";
    const INSTALL_KEY = "zedon_install_v1";

    const DOHStatus = { NoError: 0 };
    async function queryDNSRecords(hostname, recordType) {
      const r = await fetch(
        `https://1.1.1.1/dns-query?name=${encodeURIComponent(hostname)}&type=${recordType}`,
        { headers: { Accept: "application/dns-json" } }
      );
      if (!r.ok) throw new Error(`DoH failed: ${r.status}`);
      const response = await r.json();
      if (typeof response.Status !== "number") throw new Error("Unexpected DoH response");
      return response;
    }
    async function queryTXT(hostname) {
      const r = await queryDNSRecords(hostname, "TXT");
      if (r.Status !== DOHStatus.NoError) return [];
      return (r.Answer || []).map(a => {
        try { return JSON.parse(a.data); } catch { return String(a.data).replace(/^"|"$/g, ""); }
      });
    }

    async function deriveKey(password, salt) {
      const enc = new TextEncoder();
      const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: 120000, hash: "SHA-256" },
        base,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }
    async function encryptLocal(password, plaintext) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveKey(password, salt);
      const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(plaintext));
      return {
        salt: btoa(String.fromCharCode(...salt)),
        iv: btoa(String.fromCharCode(...iv)),
        data: btoa(String.fromCharCode(...new Uint8Array(ct)))
      };
    }
    async function decryptLocal(password, blob) {
      const salt = Uint8Array.from(atob(blob.salt), c => c.charCodeAt(0));
      const iv = Uint8Array.from(atob(blob.iv), c => c.charCodeAt(0));
      const data = Uint8Array.from(atob(blob.data), c => c.charCodeAt(0));
      const key = await deriveKey(password, salt);
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
      return new TextDecoder().decode(pt);
    }

    async function generatePGPKey(name, email, passphrase) {
      const { privateKey, publicKey } = await openpgp.generateKey({
        type: "ecc",
        curve: "curve25519",
        userIDs: [{ name, email: email || (name + "@zedon.tech") }],
        passphrase,
        format: "armored"
      });
      return { privateKey, publicKey };
    }
    async function encryptMessage(plaintext, publicKeyArmored) {
      const publicKey = await openpgp.readKey({ armoredKey: publicKeyArmored });
      const message = await openpgp.createMessage({ text: plaintext });
      return openpgp.encrypt({ message, encryptionKeys: publicKey, format: "armored" });
    }
    async function decryptMessage(ciphertext, privateKeyArmored, passphrase) {
      const privateKey = await openpgp.decryptKey({
        privateKey: await openpgp.readPrivateKey({ armoredKey: privateKeyArmored }),
        passphrase
      });
      const message = await openpgp.readMessage({ armoredMessage: ciphertext });
      const { data } = await openpgp.decrypt({ message, decryptionKeys: privateKey, format: "utf8" });
      return data;
    }
    function normalizeFp(fp) {
      if (!fp) return "";
      return String(fp).replace(/[^0-9a-fA-F]/g, "").toUpperCase();
    }
    function fingerprintsMatch(expected, actual) {
      const a = normalizeFp(expected);
      const b = normalizeFp(actual);
      if (!a || !b) return false;
      // allow full fingerprint or suffix (16+ hex chars)
      if (a.length >= 16 && b.length >= 16) {
        return b.endsWith(a) || a.endsWith(b) || a === b;
      }
      return a === b;
    }
    async function fingerprintOfArmored(armored) {
      try {
        const key = await openpgp.readKey({ armoredKey: armored });
        return key.getFingerprint().toUpperCase();
      } catch (e) {
        return null;
      }
    }
    function fingerprintShort(armoredOrFp) {
      if (!armoredOrFp) return "(none)";
      // already a hex fingerprint?
      const norm = normalizeFp(armoredOrFp);
      if (norm.length >= 16 && norm.length <= 40 && !/BEGIN/.test(armoredOrFp)) {
        return norm.slice(-16);
      }
      try {
        const m = armoredOrFp.match(/-----BEGIN PGP PUBLIC KEY BLOCK-----([\s\S]+?)-----END/);
        if (!m) return norm.slice(-16) || "(?)";
        return m[1].replace(/\s+/g, "").slice(-16).toUpperCase();
      } catch { return "(?)"; }
    }
    /** Resolve remote user PGP: fetch URL if needed, verify against DNS fingerprint */
    async function resolveRecipientPublicKey(target) {
      if (!target) return null;
      // LOCAL session key already armored
      if (target.source === "LOCAL" && target.pgp && /BEGIN PGP/.test(target.pgp)) {
        return target.pgp;
      }
      let armored = null;
      const ref = target.pgp || target.pgpUrl || null;
      const expectedFp = target.pgpFp || null;

      if (ref && /^https?:\/\//i.test(ref)) {
        print("Fetching PGP key: " + ref, "sys");
        const res = await fetch(ref, { credentials: "omit" });
        if (!res.ok) throw new Error("Key fetch failed HTTP " + res.status);
        armored = (await res.text()).trim();
        if (!/BEGIN PGP PUBLIC KEY BLOCK/.test(armored)) {
          throw new Error("Fetched file is not an armored public key");
        }
      } else if (ref && /BEGIN PGP PUBLIC KEY BLOCK/.test(ref)) {
        armored = ref;
      } else if (!ref && expectedFp) {
        throw new Error("Only fingerprint in DNS — provide PGP=<https://...url.asc>");
      } else {
        return null;
      }

      const actualFp = await fingerprintOfArmored(armored);
      if (!actualFp) throw new Error("Could not read fingerprint from key");

      if (expectedFp) {
        if (!fingerprintsMatch(expectedFp, actualFp)) {
          throw new Error(
            "Fingerprint mismatch! DNS=" + normalizeFp(expectedFp).slice(-16) +
            " key=" + actualFp.slice(-16)
          );
        }
        print("PGP fingerprint OK: " + actualFp.slice(-16), "info");
      } else {
        print("PGP fingerprint (no DNS fp to check): " + actualFp.slice(-16), "warn");
      }
      return armored;
    }

    let remoteUsers = [];
    let currentUser = "guest";
    let session = null;
    let cmdHistory = [];
    let histIdx = -1;
    let busy = false;
    let interactive = null;

    function loadStore() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }
      catch { return {}; }
    }
    function saveStore(obj) { localStorage.setItem(STORAGE_KEY, JSON.stringify(obj)); }

    async function saveSession() {
      if (!session) return;
      const store = loadStore();
      const payload = {
        publicKey: session.publicKey,
        privateKey: session.privateKey,
        messages: session.messages || [],
        created: session.created || Date.now()
      };
      store.users = store.users || {};
      store.users[session.name] = await encryptLocal(session.password, JSON.stringify(payload));
      saveStore(store);
    }
    async function loadUser(name, password) {
      const store = loadStore();
      const blob = store.users && store.users[name];
      if (!blob) {
        // try case-insensitive
        const key = Object.keys(store.users || {}).find(k => k.toLowerCase() === name.toLowerCase());
        if (!key) throw new Error("User not found locally");
        const json = await decryptLocal(password, store.users[key]);
        const data = JSON.parse(json);
        return { name: key, password, publicKey: data.publicKey, privateKey: data.privateKey, messages: data.messages || [], created: data.created };
      }
      const json = await decryptLocal(password, blob);
      const data = JSON.parse(json);
      return { name, password, publicKey: data.publicKey, privateKey: data.privateKey, messages: data.messages || [], created: data.created };
    }
    function listLocalUserNames() {
      return Object.keys(loadStore().users || {});
    }

    const term = document.getElementById("terminal");
    const inputRow = document.getElementById("inputRow");
    const input = document.getElementById("cmd");
    const promptLabel = document.getElementById("promptLabel");
    const windowTitle = document.getElementById("windowTitle");

    function appendBeforePrompt(node) {
      term.insertBefore(node, inputRow);
      term.scrollTop = term.scrollHeight;
    }
    function print(text, cls) {
      const div = document.createElement("div");
      div.className = "line " + (cls || "out");
      div.textContent = text;
      appendBeforePrompt(div);
    }
    function printHtml(html, cls) {
      const div = document.createElement("div");
      div.className = "line " + (cls || "out");
      div.innerHTML = html;
      appendBeforePrompt(div);
    }
    function printPromptLine(cmd) {
      const div = document.createElement("div");
      div.className = "line cmd";
      div.innerHTML = '<span class="prompt">' + escapeHtml(promptText()) + '</span> ' + escapeHtml(cmd);
      appendBeforePrompt(div);
    }
    function escapeHtml(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }
    function promptText() { return currentUser + "@" + DOMAIN + ":~$"; }
    function refreshPrompt() {
      promptLabel.textContent = promptText();
      windowTitle.textContent = currentUser + "@" + DOMAIN + " — bash";
    }
    function clearScreen() {
      Array.from(term.children).forEach(function (el) {
        if (el !== inputRow) el.remove();
      });
    }

    function parseUserRecord(txt) {
      if (typeof txt !== "string" || txt.indexOf("usr=") === -1) return null;
      // Value runs until the next known label= (so "role=organization owner" keeps both words)
      const LABELS = "usr|role|PGP|pgp|fp|fingerprint|pgpfp|PGPFP";
      function get(key) {
        const re = new RegExp(
          "(?:^|\\s)" + key + "=(.+?)(?=\\s+(?:" + LABELS + ")=|$)",
          "i"
        );
        const m = txt.match(re);
        return m ? m[1].trim() : null;
      }
      const usr = get("usr");
      if (!usr) return null;
      // PGP= may be URL or (rarely) inline; fp= / fingerprint= / pgpfp= is the DNS fingerprint
      const pgpRaw = get("PGP") || get("pgp") || null;
      const pgpFp = get("fp") || get("fingerprint") || get("pgpfp") || get("PGPFP") || null;
      let pgpUrl = null;
      let pgpInline = null;
      if (pgpRaw) {
        if (/^https?:\/\//i.test(pgpRaw)) pgpUrl = pgpRaw;
        else if (/BEGIN/.test(pgpRaw)) pgpInline = pgpRaw;
        else if (!pgpFp && /^[0-9a-fA-F]{16,40}$/.test(pgpRaw.replace(/\s/g, ""))) {
          return {
            name: usr,
            role: get("role") || "user",
            pgp: null,
            pgpUrl: null,
            pgpFp: pgpRaw,
            source: "REMOTE"
          };
        } else {
          pgpUrl = pgpRaw;
        }
      }
      return {
        name: usr,
        role: get("role") || "user",
        pgp: pgpInline || pgpUrl,
        pgpUrl: pgpUrl,
        pgpFp: pgpFp,
        source: "REMOTE"
      };
    }

    async function loadRemoteUsers() {
      print("DNS TXT query: " + DOMAIN + " ...", "sys");
      try {
        const txts = await queryTXT(DOMAIN);
        remoteUsers = [];
        for (const t of txts) {
          const u = parseUserRecord(t);
          if (u) remoteUsers.push(u);
          String(t).split(/[|;]/).forEach(function (part) {
            const u2 = parseUserRecord(part.trim());
            if (u2 && !remoteUsers.find(function (x) { return x.name === u2.name; })) remoteUsers.push(u2);
          });
        }
        print("  " + remoteUsers.length + " user record(s) found.", "sys");
      } catch (e) {
        print("DNS error: " + (e.message || e), "warn");
        remoteUsers = [];
      }
    }

    function findUser(name) {
      const n = name.toLowerCase();
      if (session && session.name.toLowerCase() === n) {
        return { name: session.name, role: "local", pgp: session.publicKey, source: "LOCAL" };
      }
      const localName = listLocalUserNames().find(function (x) { return x.toLowerCase() === n; });
      if (localName) return { name: localName, role: "local", pgp: null, source: "LOCAL" };
      return remoteUsers.find(function (u) { return u.name.toLowerCase() === n; }) || null;
    }

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/i.test(email);
    }

    async function doSendMessage(to, fromEmail, body) {
      if (!isValidEmail(fromEmail)) { print("Invalid email: " + fromEmail, "err"); return; }
      if (!body.trim()) { print("Message cannot be empty.", "err"); return; }

      const target = findUser(to);
      let ciphertext = null;
      let usedPgp = false;

      if (target && (target.pgp || target.pgpUrl || target.pgpFp)) {
        try {
          print("Resolving recipient PGP key...", "sys");
          const armored = await resolveRecipientPublicKey(target);
          if (armored) {
            print("Encrypting with recipient PGP key...", "sys");
            ciphertext = await encryptMessage(body, armored);
            usedPgp = true;
          } else {
            print("No usable PGP key for recipient — plaintext.", "sys");
          }
        } catch (e) {
          print("PGP key/encrypt failed: " + (e.message || e), "err");
          print("Sending as plaintext.", "warn");
        }
      } else {
        print("No known PGP key for recipient — plaintext.", "sys");
      }

      const payload = {
        to: to,
        from: fromEmail,
        message: ciphertext || body,
        encrypted: usedPgp,
        sender_pubkey: session ? session.publicKey : null,
        source: "zedon.tech-terminal",
        timestamp: new Date().toISOString(),
        from_user: currentUser
      };

      const size = new TextEncoder().encode(payload.message).length;
      const entry = { ts: Date.now(), to: to, from: fromEmail, size: size, encrypted: usedPgp, body: payload.message.slice(0, 2000) };

      if (session) {
        session.messages = session.messages || [];
        session.messages.push(entry);
        await saveSession();
      } else {
        const store = loadStore();
        store.guestMessages = store.guestMessages || [];
        store.guestMessages.push(entry);
        if (store.guestMessages.length > 50) store.guestMessages = store.guestMessages.slice(-50);
        saveStore(store);
      }

      print("Sending → " + to + "  (" + size + " B" + (usedPgp ? ", PGP" : "") + ") ...", "sys");
      busy = true;
      input.disabled = true;
      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          print("Message sent. ✓  (also saved locally)", "info");
        } else {
          const txt = await res.text().catch(function () { return ""; });
          print("Worker error (" + res.status + "). Message kept locally.", "warn");
          if (txt) print(txt.slice(0, 180), "err");
        }
      } catch (e) {
        print("Network error — message saved locally.", "warn");
        print(String(e.message || e), "err");
        print("WORKER_URL = " + WORKER_URL, "sys");
      } finally {
        busy = false;
        input.disabled = false;
        input.focus();
      }
    }

    // ───────────── PWA install tracking ─────────────
    // State lives in localStorage (INSTALL_KEY) as { installed, ts, via }.
    // It is a best-effort flag, kept honest by three signals:
    //   • running in standalone/app mode        → installed = true
    //   • "appinstalled" event                  → installed = true
    //   • "beforeinstallprompt" fires in a tab  → browser says NOT installed → installed = false
    let deferredPrompt = null;

    function loadInstall() {
      try { return JSON.parse(localStorage.getItem(INSTALL_KEY) || "{}"); }
      catch (e) { return {}; }
    }
    function saveInstall(obj) {
      try { localStorage.setItem(INSTALL_KEY, JSON.stringify(obj)); } catch (e) {}
    }
    function markInstalled(via) {
      saveInstall({ installed: true, ts: Date.now(), via: via });
    }
    function markNotInstalled() {
      try { localStorage.removeItem(INSTALL_KEY); } catch (e) {}
    }
    function isStandalone() {
      return ["standalone", "fullscreen", "minimal-ui", "window-controls-overlay"].some(function (m) {
        return window.matchMedia("(display-mode: " + m + ")").matches;
      }) || navigator.standalone === true ||
        (document.referrer || "").indexOf("android-app://") === 0;
    }
    function isIOS() {
      return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    }
    function isAndroid() { return /android/i.test(navigator.userAgent); }
    function installState() {
      const st = loadInstall();
      return {
        running: isStandalone(),
        flagged: !!st.installed,
        ts: st.ts || null,
        via: st.via || null,
        promptable: !!deferredPrompt
      };
    }
    function fmtTs(ts) {
      return ts ? new Date(ts).toISOString().replace("T", " ").slice(0, 19) : "?";
    }

    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      deferredPrompt = e;
      // The browser only offers installation when the app is NOT installed → clear a stale flag.
      if (loadInstall().installed && !isStandalone()) markNotInstalled();
    });
    window.addEventListener("appinstalled", function () {
      deferredPrompt = null;
      markInstalled("appinstalled");
      print("App installed. ✓", "info");
    });
    try {
      window.matchMedia("(display-mode: standalone)").addEventListener("change", function (e) {
        if (e.matches) markInstalled("standalone");
      });
    } catch (e) {}
    if (isStandalone()) markInstalled("standalone");

    async function diagnoseInstall() {
      const ua = navigator.userAgent;
      if (/firefox/i.test(ua) && !isAndroid()) {
        print("Firefox desktop cannot install web apps. Use Chrome, Edge or another Chromium browser.", "warn");
      } else if (/safari/i.test(ua) && !/chrom|crios|edg|android/i.test(ua) && !isIOS()) {
        print("Safari (macOS) has no install prompt. Use File → Add to Dock.", "warn");
      }
      if (location.protocol === "file:") {
        print("Page opened from a file:// URL. Installing needs https:// (or http://localhost).", "err");
        return;
      }
      if (location.protocol !== "https:" && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
        print("Page is not served over HTTPS. Installing needs a secure origin.", "err");
      }
      const link = document.querySelector('link[rel="manifest"]');
      if (!link) { print("No <link rel=\"manifest\"> in the page.", "err"); return; }
      const mUrl = link.href;
      let m;
      try {
        const r = await fetch(mUrl, { credentials: "same-origin" });
        if (!r.ok) { print("Manifest not reachable: HTTP " + r.status + "  " + mUrl, "err"); return; }
        m = await r.json();
      } catch (e) {
        print("Manifest fetch/parse failed: " + (e.message || e) + "  " + mUrl, "err");
        return;
      }
      const problems = [];
      const modes = ["standalone", "fullscreen", "minimal-ui", "window-controls-overlay"];
      if (!(m.name || m.short_name)) problems.push("name / short_name missing");
      if (!m.start_url) problems.push("start_url missing");
      const dispOk = modes.indexOf(m.display) !== -1 ||
        (Array.isArray(m.display_override) && m.display_override.some(function (d) { return modes.indexOf(d) !== -1; }));
      if (!dispOk) problems.push('display is "' + (m.display || "browser (default)") + '", it must be "standalone"');
      const icons = Array.isArray(m.icons) ? m.icons : [];
      function findIcon(n) {
        return icons.find(function (i) {
          return String(i.sizes || "").split(/\s+/).some(function (sz) { return parseInt(sz, 10) >= n; });
        });
      }
      for (const n of [192, 512]) {
        const ic = findIcon(n);
        if (!ic || !ic.src) { problems.push("no " + n + "x" + n + " icon in the manifest"); continue; }
        const u = new URL(ic.src, mUrl).href;
        try {
          const r = await fetch(u);
          const ct = (r.headers && r.headers.get && r.headers.get("content-type")) || "image/";
          if (!r.ok) problems.push(n + "px icon not reachable: HTTP " + r.status + "  " + u);
          else if (!/^image\//i.test(ct)) problems.push(n + "px icon is not an image (" + ct + ")  " + u);
        } catch (e) {
          problems.push(n + "px icon fetch failed  " + u);
        }
      }
      if (problems.length) {
        print("Manifest problems found:", "err");
        problems.forEach(function (x) { print("  - " + x, "err"); });
      } else {
        print("Manifest looks fine (" + mUrl + ").", "info");
        print("Then it is probably already installed, or the browser has not offered the prompt yet.", "sys");
        print("Reload the page and run 'install' again, or use the install icon in the address bar.", "sys");
      }
    }

    async function printManualInstallHelp() {
      if (isIOS()) {
        print("iOS has no install API. Do it by hand:", "sys");
        print("  Share (□↑) → Add to Home Screen");
        return;
      }
      print("The browser did not offer an install prompt. Checking why...", "warn");
      await diagnoseInstall();
    }

    async function runInstall() {
      if (!deferredPrompt) {
        busy = true;
        input.disabled = true;
        try { await printManualInstallHelp(); }
        finally { busy = false; input.disabled = false; input.focus(); }
        return;
      }
      const dp = deferredPrompt;
      deferredPrompt = null; // the event is single-use
      busy = true;
      input.disabled = true;
      try {
        print("Waiting for the browser's install dialog...", "sys");
        dp.prompt();
        const choice = await dp.userChoice;
        if (choice && choice.outcome === "accepted") {
          markInstalled("prompt");
          print("Install accepted. ✓", "info");
        } else {
          print("Install dismissed.", "warn");
          print("Run 'install' again later; the browser may offer it again after a reload.", "sys");
        }
      } catch (e) {
        print("Install error: " + (e.message || e), "err");
      } finally {
        busy = false;
        input.disabled = false;
        input.focus();
      }
    }

    async function runUninstall() {
      let swCount = 0, cacheCount = 0;
      try {
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function (r) { return r.unregister(); }));
          swCount = regs.length;
        }
      } catch (e) { print("Service worker cleanup failed: " + (e.message || e), "warn"); }
      try {
        if (window.caches && caches.keys) {
          const keys = await caches.keys();
          await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          cacheCount = keys.length;
        }
      } catch (e) { print("Cache cleanup failed: " + (e.message || e), "warn"); }
      markNotInstalled();
      print("Cleanup done: " + swCount + " service worker(s), " + cacheCount + " cache(s), install flag cleared.", "info");
      print("A web page cannot remove an installed app itself. Remove the icon by hand:", "sys");
      if (isIOS()) {
        print("  Long-press the icon on the Home Screen → Remove App → Delete App");
      } else if (isAndroid()) {
        print("  Long-press the app icon → Uninstall (or Remove)");
      } else {
        print("  In the app window: ⋮ menu → Uninstall zedon.tech…");
        print("  or open chrome://apps (edge://apps) → right-click the app → Remove");
      }
      if (isStandalone()) {
        print("You are inside the app right now; the flag is set again on next start until you remove it.", "warn");
      }
      print("Your local users and keys were not touched (use 'nuke' for that).", "sys");
    }
    // ───────────── /PWA install tracking ─────────────

    const commands = {
      help: function () {
        print("Available commands:", "sys");
        print("  help              – this list");
        print("  whoami            – current identity");
        print("  users             – users (DNS + local)");
        print("  about             – short info");
        print("  clear             – clear screen");
        print("  history           – sent messages (time, to, size)");
        print("  register <name>   – name yourself + password + PGP keygen");
        print("  login <name>      – login as local user");
        print("  logout            – back to guest");
        print("  message           – send message (interactive or args)");
        print("  message <to> <email> <text...>");
        print("  decode            – decrypt PGP message (panel)");
        print("  pubkey            – show your public key");
        print("  export            – download PGP key file(s) named after user");
        print("  install           – install as an app (asks to confirm)");
        print("  uninstall         – clean up app data + how to remove it (asks to confirm)");
        print("  nuke              – wipe all local data (GDPR)");
        print("  exit              – close this tab/window");
        print("");
        print("Messages are saved locally. DNS TXT format: usr= role= PGP=");
      },
      whoami: function () {
        print(currentUser);
        print("  host : " + DOMAIN);
        print("  mode : " + (session ? "authenticated local" : "guest"));
        if (session) print("  pgp  : " + fingerprintShort(session.publicKey));
        (function () {
          const st = installState();
          let app = "not installed";
          if (st.running) app = "installed (running as app)";
          else if (st.flagged) app = "installed (since " + fmtTs(st.ts) + ")";
          print("  app  : " + app);
        })();
      },
      users: function () {
        const seen = {};
        const blocks = [];
        listLocalUserNames().forEach(function (name) {
          seen[name.toLowerCase()] = true;
          const isMe = session && session.name === name;
          const pgp = isMe ? fingerprintShort(session.publicKey) : "(locked)";
          blocks.push(function () {
            print("user name: " + name);
            print("role: local");
            print("PGP fingerprint: " + pgp);
            print("LOCAL user");
          });
        });
        remoteUsers.forEach(function (u) {
          if (seen[u.name.toLowerCase()]) return;
          const fp = u.pgpFp
            ? normalizeFp(u.pgpFp).slice(-16)
            : (u.pgp && !/^https?:/i.test(u.pgp) ? fingerprintShort(u.pgp) : "(none)");
          const url = u.pgpUrl || (u.pgp && /^https?:/i.test(u.pgp) ? u.pgp : "");
          blocks.push(function () {
            print("user name: " + u.name);
            print("role: " + u.role);
            print("PGP fingerprint: " + fp);
            if (url) {
              printHtml(
                '<a class="term-link" href="' + escapeHtml(url) +
                '" target="_blank" rel="noopener noreferrer" download="' +
                escapeHtml(u.name) + '.asc">download ' + escapeHtml(u.name) +
                "'s public key</a>"
              );
            }
            print("REMOTE user");
          });
        });
        if (!blocks.length) {
          print("(no known users — register or add DNS TXT)", "sys");
          return;
        }
        blocks.forEach(function (render, i) {
          render();
          if (i < blocks.length - 1) {
            print(" "); // visible blank line between users
          }
        });
      },
      about: function () {
        print("Welcome to a not yet formed LLC's homepage!");
        print("Feel free to send a message to us! All sent messages are saved locally.");
      },
      clear: function () { clearScreen(); },
      history: function () {
        let all = [];
        if (session) all = session.messages || [];
        else {
          try { all = loadStore().guestMessages || []; } catch (e) { all = []; }
        }
        if (!all.length) { print("(no saved messages)"); return; }
        all.slice().reverse().forEach(function (m) {
          const ts = new Date(m.ts).toISOString().replace("T", " ").slice(0, 19);
          const size = m.size != null ? m.size : 0;
          print(ts + "  → " + m.to + "  " + size + " B");
        });
      },
      register: function (args) {
        if (session) { print("Already logged in. Use: logout", "err"); return; }
        const name = (args[0] || "").trim();
        if (!name || !/^[a-zA-Z0-9._-]{2,32}$/.test(name)) {
          print("Usage: register <name>   (2–32 chars, a-z 0-9 . _ -)", "err");
          return;
        }
        if (name.toLowerCase() === "guest") { print("'guest' is reserved.", "err"); return; }
        if (listLocalUserNames().some(function (x) { return x.toLowerCase() === name.toLowerCase(); })) {
          print("Name already exists locally. Use: login " + name, "err");
          return;
        }
        interactive = { step: "reg_pass", data: { name: name } };
        print("Register: " + name, "sys");
        print("Choose a password (min 6 chars, protects key + data):");
        promptLabel.textContent = "password>";
        input.type = "password";
      },
      login: function (args) {
        if (session) { print("Already logged in (" + session.name + "). Use: logout", "err"); return; }
        const name = (args[0] || "").trim();
        if (!name) { print("Usage: login <name>", "err"); return; }
        if (!listLocalUserNames().some(function (x) { return x.toLowerCase() === name.toLowerCase(); })) {
          print("No such local user. Use: register " + name, "err");
          return;
        }
        interactive = { step: "login_pass", data: { name: name } };
        print("Password:");
        promptLabel.textContent = "password>";
        input.type = "password";
      },
      logout: function () {
        if (!session) { print("Already guest.", "sys"); return; }
        print("Logout: " + session.name + " → guest", "sys");
        session = null;
        currentUser = "guest";
        refreshPrompt();
      },
      pubkey: function () {
        if (!session) { print("No logged-in user / key. Use: register <name>", "err"); return; }
        print(session.publicKey);
      },
      export: function () {
        if (!session) {
          print("No logged-in user. Use: login <name> or register <name>", "err");
          return;
        }
        // Public key
        downloadText(session.name + ".asc", session.publicKey);
        print("Downloaded: " + session.name + ".asc  (public key)", "info");
        // Private key (armored) — same basename with -private suffix is common; user asked filename = username
        // Export private as <name>-private.asc so both are usable, public stays <name>.asc
        downloadText(session.name + "-private.asc", session.privateKey);
        print("Downloaded: " + session.name + "-private.asc  (private key — keep secret)", "warn");
      },
      install: function () {
        const st = installState();
        if (st.running) { print("Already running as an installed app.", "sys"); return; }
        if (st.flagged && !st.promptable) {
          print("Already installed on this device (since " + fmtTs(st.ts) + ").", "sys");
          print("Open it from your app launcher / home screen.", "sys");
          return;
        }
        interactive = { step: "install_confirm", data: {} };
        print("Install zedon.tech terminal as an app on this device. Are you sure? (type 'YES')", "warn");
        promptLabel.textContent = "confirm>";
      },
      uninstall: function () {
        const st = installState();
        if (!st.running && !st.flagged) {
          print("No install recorded on this device.", "sys");
          if (isIOS()) print("(iOS keeps a Home Screen app's data separate: run 'uninstall' inside the app.)", "sys");
          return;
        }
        interactive = { step: "uninstall_confirm", data: {} };
        print("This clears the app's caches, service workers and the install flag,", "warn");
        print("then shows how to remove the icon. Keys and users stay.", "warn");
        print("Uninstall? Are you sure? (type 'YES')", "warn");
        promptLabel.textContent = "confirm>";
      },
      nuke: function () {
        interactive = { step: "nuke_confirm", data: {} };
        print("Holy GDPR! Are you sure? (type 'YES')", "warn");
        promptLabel.textContent = "confirm>";
      },
      exit: function () {
        if (busy) return;
        busy = true;
        input.disabled = true;
        print("Bye! Come back soon!", "info");
        var countLine = document.createElement("div");
        countLine.className = "line sys";
        countLine.textContent = "5";
        term.appendChild(countLine);
        term.scrollTop = term.scrollHeight;
        var n = 5;
        function tick() {
          n--;
          if (n > 0) {
            countLine.textContent = String(n);
            setTimeout(tick, 1000);
          } else {
            countLine.textContent = "0";
            window.close();
            setTimeout(function () {
              print("Browser blocked window.close(). Close the tab manually.", "warn");
              busy = false;
              input.disabled = false;
              input.focus();
            }, 400);
          }
        }
        setTimeout(tick, 1000);
      },
      decode: function () { openDecodePanel(); },
      message: async function (args) {
        if (args.length === 0) {
          interactive = { step: "msg_to", data: {} };
          print("Send message (cancel to abort)", "sys");
          print("Recipient:");
          promptLabel.textContent = "to>";
          return;
        }
        if (args.length < 3) {
          print("Usage: message <to> <email> <text...>", "err");
          return;
        }
        await doSendMessage(args[0], args[1], args.slice(2).join(" "));
      }
    };

    async function handleInteractive(line) {
      const t = line.trim();
      if (t.toLowerCase() === "cancel") {
        interactive = null;
        input.type = "text";
        refreshPrompt();
        print("Cancelled.", "warn");
        return;
      }
      const step = interactive.step;
      const d = interactive.data;

      if (step === "reg_pass") {
        if (t.length < 6) { print("Password too short (min 6).", "err"); return; }
        d.password = t;
        interactive.step = "reg_pass2";
        print("Confirm password:");
        promptLabel.textContent = "confirm>";
        return;
      }
      if (step === "reg_pass2") {
        if (t !== d.password) {
          print("Mismatch. Restart with: register " + d.name, "err");
          interactive = null;
          input.type = "text";
          refreshPrompt();
          return;
        }
        print("Generating PGP keypair (curve25519)...", "sys");
        busy = true;
        try {
          const keys = await generatePGPKey(d.name, d.name + "@" + DOMAIN, d.password);
          session = {
            name: d.name,
            password: d.password,
            publicKey: keys.publicKey,
            privateKey: keys.privateKey,
            messages: [],
            created: Date.now()
          };
          await saveSession();
          currentUser = d.name;
          refreshPrompt();
          print("Done. Logged in as: " + d.name, "info");
          print("Public key fingerprint: " + fingerprintShort(keys.publicKey), "sys");
          print("Key and messages are password-protected in this browser.");
        } catch (e) {
          print("Keygen error: " + (e.message || e), "err");
        } finally {
          busy = false;
          interactive = null;
          input.type = "text";
          refreshPrompt();
        }
        return;
      }
      if (step === "login_pass") {
        try {
          session = await loadUser(d.name, t);
          currentUser = session.name;
          refreshPrompt();
          print("Welcome, " + session.name, "info");
        } catch (e) {
          print("Wrong password or corrupted data.", "err");
        } finally {
          interactive = null;
          input.type = "text";
          refreshPrompt();
        }
        return;
      }
      if (step === "msg_to") {
        if (!t) { print("Enter a recipient.", "err"); return; }
        d.to = t;
        interactive.step = "msg_email";
        print("Your email address:");
        promptLabel.textContent = "email>";
        return;
      }
      if (step === "msg_email") {
        if (!isValidEmail(t)) { print("Invalid email.", "err"); return; }
        d.email = t;
        interactive.step = "msg_body";
        print("Message (Enter to send):");
        promptLabel.textContent = "msg>";
        return;
      }
      if (step === "msg_body") {
        interactive = null;
        refreshPrompt();
        await doSendMessage(d.to, d.email, t);
        return;
      }
      if (step === "install_confirm") {
        interactive = null;
        refreshPrompt();
        if (t === "YES") {
          await runInstall();
        } else {
          print("Install aborted. (You must type YES in capitals.)", "warn");
        }
        return;
      }
      if (step === "uninstall_confirm") {
        interactive = null;
        refreshPrompt();
        if (t === "YES") {
          busy = true;
          try { await runUninstall(); }
          finally { busy = false; input.focus(); }
        } else {
          print("Uninstall aborted. (You must type YES in capitals.)", "warn");
        }
        return;
      }
      if (step === "nuke_confirm") {
        interactive = null;
        refreshPrompt();
        if (t === "YES") {
          localStorage.removeItem(STORAGE_KEY);
          session = null;
          currentUser = "guest";
          cmdHistory = [];
          histIdx = -1;
          refreshPrompt();
          print("All local data wiped. You are guest again.", "info");
        } else {
          print("Nuke aborted. (You must type YES in capitals.)", "warn");
        }
      }
    }

    function downloadText(filename, text) {
      const blob = new Blob([text], { type: "application/pgp-keys; charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        URL.revokeObjectURL(url);
        a.remove();
      }, 500);
    }

    function openDecodePanel() {
      document.getElementById("decodeModal").classList.add("open");
      document.getElementById("decodeCipher").value = "";
      document.getElementById("decodePass").value = "";
      const res = document.getElementById("decodeResult");
      res.classList.remove("show");
      res.textContent = "";

      const info = document.getElementById("decodeKeyInfo");
      const passWrap = document.getElementById("decodePassWrap");

      if (session && session.privateKey) {
        info.textContent = "Key: " + session.name + " (registered)  ·  " + fingerprintShort(session.publicKey);
        info.style.color = "#8cf";
        // passphrase optional — auto-uses session.password
        passWrap.style.display = "";
        document.getElementById("decodePassLabel").textContent =
          "Passphrase (optional — leave empty to use your login password)";
        document.getElementById("decodePass").placeholder = "Leave empty → use session password";
      } else {
        info.textContent = "No registered key loaded. Run: login <name>  or  register <name>";
        info.style.color = "#ffaa00";
        passWrap.style.display = "none";
      }
    }
    function closeDecodePanel() {
      document.getElementById("decodeModal").classList.remove("open");
      input.focus();
    }
    document.getElementById("decodeCancel").onclick = closeDecodePanel;
    document.getElementById("decodeRun").onclick = async function () {
      const cipher = document.getElementById("decodeCipher").value.trim();
      const passInput = document.getElementById("decodePass").value;
      const resEl = document.getElementById("decodeResult");
      if (!cipher) {
        resEl.textContent = "No ciphertext.";
        resEl.classList.add("show");
        return;
      }
      if (!session || !session.privateKey) {
        resEl.textContent = "No registered key in session. Use: login <name> or register <name>";
        resEl.classList.add("show");
        return;
      }
      // Always use the registered user's private key; passphrase defaults to login password
      const passphrase = passInput || session.password;
      try {
        const plain = await decryptMessage(cipher, session.privateKey, passphrase);
        resEl.textContent = plain;
        resEl.classList.add("show");
      } catch (e) {
        resEl.textContent = "Decrypt failed: " + (e.message || e) +
          "\n\nTip: leave passphrase empty to use your login password, or enter the key passphrase.";
        resEl.classList.add("show");
      }
    };

    function runCommand(raw) {
      const line = raw;
      const trimmed = line.trim();

      if (interactive) {
        printPromptLine(input.type === "password" ? "********" : line);
        handleInteractive(line);
        return;
      }

      if (!trimmed) return;

      cmdHistory.push(trimmed);
      histIdx = cmdHistory.length;
      printPromptLine(trimmed);

      const parts = trimmed.split(/\s+/);
      const cmd = parts[0].toLowerCase();
      const args = parts.slice(1);

      if (commands[cmd]) {
        const r = commands[cmd](args);
        if (r && typeof r.then === "function") { /* async */ }
      } else {
        print("command not found: " + cmd, "err");
        print("Type: help", "sys");
      }
    }

    input.addEventListener("keydown", function (e) {
      if (busy) { e.preventDefault(); return; }
      if (e.key === "Enter") {
        e.preventDefault();
        const val = input.value;
        input.value = "";
        runCommand(val);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (histIdx > 0) {
          histIdx--;
          input.value = cmdHistory[histIdx] || "";
          setTimeout(function () { input.setSelectionRange(input.value.length, input.value.length); }, 0);
        }
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        if (histIdx < cmdHistory.length - 1) {
          histIdx++;
          input.value = cmdHistory[histIdx] || "";
        } else {
          histIdx = cmdHistory.length;
          input.value = "";
        }
      } else if (e.key === "c" && e.ctrlKey) {
        if (interactive) {
          interactive = null;
          input.type = "text";
          refreshPrompt();
          print("^C", "warn");
          print("Cancelled.", "warn");
          input.value = "";
        }
      } else if (e.key === "l" && e.ctrlKey) {
        e.preventDefault();
        clearScreen();
      }
    });

    document.addEventListener("click", function (e) {
      if (!e.target.closest(".modal") && !busy) input.focus();
    });

    refreshPrompt();
    print("zedon.tech terminal", "sys");
    print("Type 'help' for available commands.", "sys");
    print("");
    await loadRemoteUsers();
    print("");
    input.focus();
  })();
  </script>
</body>
</html>
