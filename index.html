        sel.appendChild(o);
      });
      msgDraft = null;
      let to = null, subject = "", body = "", restored = false;
      const args = (pre && pre.args) || [];
      if (args.length) {                                   // 'message info text...' still pre-fills the panel
        const hit = rec.find(function (r) { return r.name.toLowerCase() === args[0].toLowerCase(); });
        if (hit) { to = hit.name; body = args.slice(1).join(" "); } else { body = args.join(" "); }
      } else if (msgSaved) {
        to = msgSaved.to; subject = msgSaved.subject; body = msgSaved.body; restored = true;
      }
      if (to && rec.some(function (r) { return r.name === to; })) sel.value = to;
      subj.value = subject;
      area.value = body;
      res.className = "result";
      res.textContent = "";
      document.getElementById("messageInfo").textContent =
        "From " + session.name + " (" + maskEmail(session.email) + "), verified. Only the message body is PGP-encrypted; the subject travels in clear text." +
        (restored ? " Your unsent draft was restored." : "");
      updateMessageRecipientInfo();
      document.getElementById("messageModal").classList.add("open");
      (subject ? area : subj).focus();
    }
    function closeMessagePanel(keepDraft) {
      if (msgSending) return;
      const subj = document.getElementById("messageSubject").value;
      const body = document.getElementById("messageBody").value;
      msgSaved = keepDraft !== false && (subj.trim() || body.trim())
        ? { to: document.getElementById("messageTo").value, subject: subj, body: body }
        : null;
      document.getElementById("messageModal").classList.remove("open");
      input.focus();
    }
    async function sendFromPanel() {
      if (msgSending) return;
      const sel = document.getElementById("messageTo");
      const subjEl = document.getElementById("messageSubject");
      const area = document.getElementById("messageBody");
      const resEl = document.getElementById("messageResult");
      const sendBtn = document.getElementById("messageSend");
      const cancelBtn = document.getElementById("messageCancel");
      function show(lines, bad) { resEl.textContent = lines.join("\n"); resEl.className = "result show" + (bad ? " bad" : ""); }
      const to = sel.value.trim();
      const subject = subjEl.value.replace(/[\r\n]+/g, " ").trim();
      const body = area.value;
      if (!to) { show(["Choose a recipient."], true); return; }
      if (!subject) { show(["The subject is required."], true); subjEl.focus(); return; }
      if (subject.length > MSG_MAX_SUBJECT) { show(["The subject is too long (max " + MSG_MAX_SUBJECT + " characters)."], true); subjEl.focus(); return; }
      if (!body.trim()) { show(["The message is empty."], true); area.focus(); return; }
      if (body.length > MSG_MAX_BODY) { show(["The message is too long: " + body.length + " characters (max " + MSG_MAX_BODY + ")."], true); area.focus(); return; }
      if (!session || !hasUserToken()) { show(["Your session is not verified. Log in again (an emailed code is needed)."], true); return; }

      msgSending = true;
      busy = true;
      input.disabled = true;
      sendBtn.disabled = true;
      cancelBtn.disabled = true;
      const log = [];
      const progress = function (t) { log.push(t); show(log, false); };
      let closed = false;
      try {
        const target = findUser(to);
        let ciphertext = null;
        let usedPgp = false;
        if (target && (target.pgp || target.pgpUrl || target.pgpFp)) {
          try {
            progress("Resolving recipient PGP key...");
            const armored = await resolveRecipientPublicKey(target, progress);
            if (armored) {
              progress("Encrypting the message body...");
              ciphertext = await encryptMessage(body, armored);
              usedPgp = true;
            } else {
              progress("No usable PGP key for the recipient: plaintext.");
            }
          } catch (e) {
            progress("PGP key/encrypt failed: " + (e.message || e));
            progress("Sending as plaintext.");
          }
        } else {
          progress("No known PGP key for the recipient: plaintext.");
        }

        const payload = {
          to: to,
          subject: subject,
          message: ciphertext || body,
          encrypted: usedPgp,
          sender_pubkey: session.publicKey,
          source: "zedon.tech-terminal",
          timestamp: new Date().toISOString(),
          user_token: session.userToken
        };
        const size = new TextEncoder().encode(payload.message).length;

        // The history keeps the PLAINTEXT you wrote (it is encrypted on disk with your login password).
        session.messages = session.messages || [];
        if (!msgDraft) {
          msgDraft = { ts: Date.now() };
          session.messages.push(msgDraft);
          if (session.messages.length > HISTORY_MAX) session.messages.splice(0, session.messages.length - HISTORY_MAX);
        }
        Object.assign(msgDraft, {
          to: to, subject: subject, from: session.email, size: size, encrypted: usedPgp,
          plain: true, body: body.slice(0, MSG_MAX_BODY), status: "sending", error: null
        });
        await saveSession();
        progress("Sending → " + to + "  (" + size + " B" + (usedPgp ? ", PGP" : "") + ") ...");

        let res = null;
        let netError = null;
        try {
          res = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
        } catch (e) {
          netError = e;
        }
        if (res && res.ok) {
          msgDraft.status = "sent";
          await saveSession();
          msgSaved = null;
          msgDraft = null;
          document.getElementById("messageModal").classList.remove("open");
          closed = true;
          print("Message sent. ✓  (saved in history)", "info");
        } else {
          let problem;
          if (netError) {
            problem = ["Network error: the message is NOT sent. It is kept in the history as failed; you can try again.", String(netError.message || netError)];
            msgDraft.error = "network error";
          } else {
            const txt = await res.text().catch(function () { return ""; });
            let data = {};
            try { data = JSON.parse(txt); } catch (e) {}
            if (res.status === 401 && data.reason === "user_token") {
              session.userToken = null;
              session.userTokenExp = 0;
              problem = ["Your session expired. Log in again to verify it. The message is kept in the history as failed."];
              msgDraft.error = "session expired";
            } else {
              problem = ["Worker error (" + res.status + "): the message is NOT sent. It is kept in the history as failed.", String(data.error || txt).slice(0, 180)];
              msgDraft.error = "HTTP " + res.status;
            }
          }
          msgDraft.status = "failed";
          await saveSession();
          show(problem.filter(Boolean), true);
        }
      } catch (e) {
        show(["Could not send: " + (e.message || e)], true);
      } finally {
        msgSending = false;
        busy = false;
        input.disabled = false;
        sendBtn.disabled = false;
        cancelBtn.disabled = false;
        if (closed) input.focus();
      }
    }
    document.getElementById("messageCancel").onclick = function () { closeMessagePanel(true); };
    document.getElementById("messageSend").onclick = sendFromPanel;
    document.getElementById("messageTo").addEventListener("change", updateMessageRecipientInfo);
    document.getElementById("messageSubject").addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); document.getElementById("messageBody").focus(); }
    });
    document.getElementById("messageBody").addEventListener("keydown", function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); sendFromPanel(); }
    });

    // ───── History panel: keyboard-navigable list, selected item in inverse video, Enter opens the whole message ─────
    const hist = { items: [], els: [], sel: 0, open: -1 };
    function fmtLocal(ts, secs) {
      const d = new Date(ts);
      const p = function (n) { return String(n).padStart(2, "0"); };
      return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes()) + (secs ? ":" + p(d.getSeconds()) : "");
    }
    function historyEntries() {
      let all = [];
      if (session) all = session.messages || [];
      else { try { all = loadStore().guestMessages || []; } catch (e) { all = []; } }
      return all.slice().reverse();       // newest first
    }
    function snippetOf(e) {
      if (e.encrypted && !e.plain) return "(stored copy is the encrypted text)";
      return String(e.body || "").replace(/\s+/g, " ").trim().slice(0, 160);
    }
    function statusTag(e) {
      const tags = [];
      if (e.encrypted) tags.push("PGP");
      if (e.status === "failed") tags.push("FAILED");
      else if (e.status === "sending") tags.push("unconfirmed");
      return tags.length ? "  [" + tags.join(" ") + "]" : "";
    }
    function fillHistoryItem(i) {
      const e = hist.items[i];
      const r = hist.els[i];
      r.l1.textContent = (hist.open === i ? "▾ " : "▸ ") + fmtLocal(e.ts) + "  → " + e.to + statusTag(e);
      r.subj.textContent = e.subject || "(no subject)";
      const snip = snippetOf(e);
      r.snip.textContent = snip ? "  —  " + snip : "";
    }
    function buildHistoryItem(e, i) {
      const el = document.createElement("div");
      el.className = "nc-item";
      el.setAttribute("role", "option");
      el.dataset.i = String(i);
      const head = document.createElement("div"); head.className = "nc-head";
      const l1 = document.createElement("div"); l1.className = "nc-l1";
      const l2 = document.createElement("div"); l2.className = "nc-l2";
      const subj = document.createElement("span"); subj.className = "nc-subj";
      const snip = document.createElement("span"); snip.className = "nc-snip";
      l2.appendChild(subj); l2.appendChild(snip);
      head.appendChild(l1); head.appendChild(l2);
      el.appendChild(head);
      hist.els[i] = { el: el, l1: l1, subj: subj, snip: snip, full: null };
      fillHistoryItem(i);
      return el;
    }
    function historyStatusText(e) {
      if (e.status === "sent") return "sent";
      if (e.status === "failed") return "NOT sent (kept here)" + (e.error ? ": " + e.error : "");
      if (e.status === "sending") return "unconfirmed (the page was closed while sending)";
      return "saved";
    }
    function openHistoryItem(i) {
      if (hist.open === i) return;
      closeHistoryItem();
      const e = hist.items[i];
      const full = document.createElement("div");
      full.className = "nc-full";
      const meta = document.createElement("div");
      meta.className = "nc-meta";
      meta.textContent = [
        "To:       " + e.to,
        "Subject:  " + (e.subject || "(no subject)"),
        "Date:     " + fmtLocal(e.ts, true),
        "Sent as:  " + (e.encrypted ? "PGP-encrypted body" : "plaintext"),
        "Status:   " + historyStatusText(e)
      ].join("\n") + (e.encrypted && !e.plain ? "\nNote:     this old entry stored the encrypted text, not what you wrote" : "");
      const msg = document.createElement("div");
      msg.className = "nc-msg";
      msg.textContent = String(e.body || "");
      full.appendChild(meta);
      full.appendChild(msg);
      hist.els[i].el.appendChild(full);
      hist.els[i].full = full;
      hist.open = i;
      fillHistoryItem(i);
      if (hist.els[i].el.scrollIntoView) hist.els[i].el.scrollIntoView({ block: "nearest" });
    }
    function closeHistoryItem() {
      const i = hist.open;
      if (i < 0) return;
      const r = hist.els[i];
      if (r && r.full) { r.el.removeChild(r.full); r.full = null; }
      hist.open = -1;
      if (r) fillHistoryItem(i);
    }
    function selectHistory(i) {
      const n = hist.items.length;
      if (!n) return;
      i = Math.max(0, Math.min(n - 1, i));
      if (hist.open !== -1 && hist.open !== i) closeHistoryItem();   // only the selected item can be open
      hist.els[hist.sel].el.classList.remove("nc-sel");
      hist.els[hist.sel].el.removeAttribute("aria-selected");
      hist.sel = i;
      hist.els[i].el.classList.add("nc-sel");
      hist.els[i].el.setAttribute("aria-selected", "true");
      if (hist.els[i].el.scrollIntoView) hist.els[i].el.scrollIntoView({ block: "nearest" });
    }
    function toggleHistory(i) {
      if (hist.open === i) closeHistoryItem(); else openHistoryItem(i);
    }
    function openHistoryPanel() {
      hist.items = historyEntries();
      hist.els = [];
      hist.sel = 0;
      hist.open = -1;
      const list = document.getElementById("historyList");
      const info = document.getElementById("historyInfo");
      list.textContent = "";
      if (!hist.items.length) {
        const d = document.createElement("div");
        d.className = "nc-empty";
        d.textContent = session ? "No messages yet. Use: message" : "No saved messages.";
        list.appendChild(d);
        info.textContent = (session ? session.name : "guest") + ": no messages";
      } else {
        hist.items.forEach(function (e, i) { list.appendChild(buildHistoryItem(e, i)); });
        hist.els[0].el.classList.add("nc-sel");
        hist.els[0].el.setAttribute("aria-selected", "true");
        info.textContent = (session ? session.name : "guest") + ": " + hist.items.length + " message(s), newest first";
      }
      document.getElementById("historyModal").classList.add("open");
      list.scrollTop = 0;
      list.focus();
    }
    document.getElementById("historyClose").onclick = function () {
      document.getElementById("historyModal").classList.remove("open");
      input.focus();
    };
    document.getElementById("historyList").addEventListener("keydown", function (e) {
      const n = hist.items.length;
      if (!n) return;
      let handled = true;
      switch (e.key) {
        case "ArrowDown": selectHistory(hist.sel + 1); break;
        case "ArrowUp": selectHistory(hist.sel - 1); break;
        case "PageDown": selectHistory(hist.sel + 5); break;
        case "PageUp": selectHistory(hist.sel - 5); break;
        case "Home": selectHistory(0); break;
        case "End": selectHistory(n - 1); break;
        case "Enter": case " ": toggleHistory(hist.sel); break;
        case "ArrowRight": openHistoryItem(hist.sel); break;
        case "ArrowLeft": closeHistoryItem(); break;
        default: handled = false;
      }
      if (handled) e.preventDefault();
    });
    document.getElementById("historyList").addEventListener("click", function (e) {
      if (e.target.closest(".nc-full")) return;            // selecting / copying the open text must not close it
      const it = e.target.closest(".nc-item");
      if (!it) return;
      const i = parseInt(it.dataset.i, 10);
      selectHistory(i);
      toggleHistory(i);
    });

    function runCommand(raw) {
      const line = raw;
      const trimmed = line.trim();

      if (interactive) {
        printPromptLine(input.type === "password" ? "********" : line);
        handleInteractive(line);
        return;
      }

      if (!trimmed) return;

      cmdHistory.push(trimmed);
      histIdx = cmdHistory.length;
      printPromptLine(trimmed);

      const parts = trimmed.split(/\s+/);
      const cmd = parts[0].toLowerCase();
      const args = parts.slice(1);

      if (commands[cmd]) {
        const r = commands[cmd](args);
        if (r && typeof r.then === "function") { /* async */ }
      } else {
        print("command not found: " + cmd, "err");
        print("Type: help", "sys");
      }
    }

    input.addEventListener("keydown", function (e) {
      if (busy) { e.preventDefault(); return; }
      if (e.key === "Enter") {
        e.preventDefault();
        const val = input.value;
        input.value = "";
        runCommand(val);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (histIdx > 0) {
          histIdx--;
          input.value = cmdHistory[histIdx] || "";
          setTimeout(function () { input.setSelectionRange(input.value.length, input.value.length); }, 0);
        }
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        if (histIdx < cmdHistory.length - 1) {
          histIdx++;
          input.value = cmdHistory[histIdx] || "";
        } else {
          histIdx = cmdHistory.length;
          input.value = "";
        }
      } else if (e.key === "c" && e.ctrlKey) {
        if (interactive) {
          resetInteractive();
          print("^C", "warn");
          print("Cancelled.", "warn");
          input.value = "";
        }
      } else if (e.key === "l" && e.ctrlKey) {
        e.preventDefault();
        clearScreen();
      }
    });

    document.addEventListener("click", function (e) {
      if (document.querySelector(".modal-overlay.open")) return;   // a dialog is open: keep the keyboard inside it
      if (!e.target.closest(".nc") && !busy) input.focus();
    });
    // Esc closes the open dialog (its Cancel / Close button)
    document.addEventListener("keydown", function (e) {
      if (e.key !== "Escape") return;
      const open = document.querySelector(".modal-overlay.open");
      const btn = open && open.querySelector("button.secondary");
      if (btn) { e.preventDefault(); btn.click(); }
    });

    refreshPrompt();
    print("zedon.tech terminal", "sys");
    print("Type 'help' for available commands.", "sys");
    print("");
    await loadRemoteUsers();
    print("");
    input.focus();
  })();
  </script>
</body>
</html>
